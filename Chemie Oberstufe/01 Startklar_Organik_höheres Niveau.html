<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startklar für Organik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Schibsted+Grotesk:wght@600;800&display=swap">
<style>
/* Layout: Lernpfad – Stationsleiste links, Arbeitsblatt auf Karopapier rechts; auf dem Handy wird die Leiste zur Schublade */
:root {
  --paper: #F3F6F9; --sheet: #FFFFFF; --ink: #15202B; --muted: #566674; --line: #D3DDE6; --grid: #E2EAF1;
  --accent: #2346B4; --accent-ink: #FFFFFF; --accent-soft: #E7ECFA;
  --oxy: #C4352B; --ok: #1E7543; --ok-soft: #E2F2E8; --bad: #B02A1E; --bad-soft: #FBE8E5; --warn: #7A5300; --warn-soft: #FCF0D4;
  --kit: #9A5B00; --kit-soft: #FBEFD9; --dark: #16202C; --dark-ink: #E3EBF1;
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E141A; --sheet: #151D25; --ink: #E3EBF1; --muted: #93A4B2; --line: #2A3743; --grid: #1D2833;
  --accent: #8EA7FF; --accent-ink: #0E141A; --accent-soft: #1C2747;
  --oxy: #FF7D71; --ok: #63CF91; --ok-soft: #133022; --bad: #FF8B80; --bad-soft: #3A1916; --warn: #F2C46B; --warn-soft: #30260E;
  --kit: #F2B75E; --kit-soft: #33260F; --dark: #1C2733; --dark-ink: #E3EBF1; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E141A; --sheet: #151D25; --ink: #E3EBF1; --muted: #93A4B2; --line: #2A3743; --grid: #1D2833;
  --accent: #8EA7FF; --accent-ink: #0E141A; --accent-soft: #1C2747;
  --oxy: #FF7D71; --ok: #63CF91; --ok-soft: #133022; --bad: #FF8B80; --bad-soft: #3A1916; --warn: #F2C46B; --warn-soft: #30260E;
  --kit: #F2B75E; --kit-soft: #33260F; --dark: #1C2733; --dark-ink: #E3EBF1; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--sheet); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; margin-right: auto; }
.brand span { color: var(--accent); }
.prog { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 120px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 32px; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
aside.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; }
.side h2 { font-size: .78rem; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
#nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav-it { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 7px 10px; cursor: pointer; color: var(--ink); }
.nav-it:hover:not(:disabled) { background: var(--sheet); border-color: var(--line); }
.nav-it.cur { background: var(--accent-soft); border-color: var(--accent); }
.nav-it:disabled { color: var(--muted); opacity: .6; cursor: default; }
.nav-no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: .8rem; font-weight: 700; border: 1.5px solid var(--line); background: var(--sheet); }
.nav-it.done .nav-no { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.nav-it.cur .nav-no { border-color: var(--accent); color: var(--accent); }
.nav-t { font-size: .92rem; line-height: 1.3; min-width: 0; }
.nav-code { margin-left: auto; font-family: var(--f-mono); font-size: .72rem; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 0 6px; }
.side-foot { margin-top: 16px; display: grid; gap: 8px; }
.confirm { background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: .9rem; }

main { min-width: 0; }
.st-head { display: grid; gap: 6px; margin-bottom: 18px; }
.st-head h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -.015em; }
.eyebrow { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.kind { color: var(--accent); }
.kind.kit { color: var(--kit); }
.codehint { color: var(--accent); font-weight: 700; font-size: .95rem; }
.steps { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
.step { display: grid; gap: 18px; }
.lead { font-size: 1.08rem; max-width: 68ch; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; max-width: 78ch; }
.card h3 { font-size: 1.1rem; }
.card.dark { background: var(--dark); color: var(--dark-ink); border-color: transparent; }
.card.input { border: 0; border-left: 5px solid var(--accent); background: var(--accent-soft); }
.card.input > h3::before { content: "Input · "; color: var(--accent); }
.card.input .ct td, .card.input .ct th { background: transparent; }
.card.input .cfig { min-width: 190px; }
.card.input .cfig svg { max-height: none; }
.exrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.exrow .fig { flex: 1 1 220px; }
.stem { display: flex; flex-wrap: wrap; gap: 6px; }
.stem span { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: .9rem; }
.stem b { color: var(--accent); }
.steps .inp { color: var(--accent); font-weight: 700; }
.card.kitcard { border: 2px dashed var(--kit); background: var(--kit-soft); }
.card.kitcard h3::before { content: "Baukasten · "; color: var(--kit); }
.list { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.small { font-size: .88rem; color: var(--muted); }
.sub-h { font-size: 1.2rem; margin-top: 8px; }

.paper { background-color: var(--sheet); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; justify-content: center; align-items: center; overflow-x: auto; }
.paper.sm { padding: 8px; }
.paper.inline { display: inline-flex; }
svg.mol { max-width: 100%; height: auto; display: block; }
.mol .bd { stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; }
.mol .bh { stroke-width: 1.4; }
.mol .num { font-family: var(--f-mono); font-size: 12px; font-weight: 700; fill: var(--accent); text-anchor: middle; dominant-baseline: central; }
.mol .lp { stroke: var(--oxy); stroke-width: 2.2; stroke-linecap: round; }
.mol .at { font-family: var(--f-body); font-weight: 700; font-size: 17px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
.mol .at-O { fill: var(--oxy); }
.mol .at-R { fill: var(--accent); }
.mol .at-H { font-weight: 400; font-size: 15px; }
.figs { display: flex; flex-wrap: wrap; gap: 14px; }
.fig { margin: 0; display: grid; gap: 6px; min-width: 0; max-width: 100%; }
.fig figcaption { font-weight: 700; text-align: center; font-size: .95rem; }
.path { display: grid; gap: 14px; }
.path-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.arrow { font-size: 1.6rem; color: var(--accent); font-weight: 700; }
.verdict { font-weight: 700; padding: 4px 12px; border-radius: 99px; font-size: .9rem; }
.verdict.good { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.mirror { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.mline { width: 0; height: 160px; border-left: 2px dashed var(--accent); }
svg.balls { width: 190px; max-width: 42%; height: auto; }
.balls .stick { stroke: #8A8F98; stroke-width: 7; stroke-linecap: round; }
.balls .ball { stroke: rgba(0,0,0,.35); stroke-width: 1.5; }

.tasks { display: grid; gap: 16px; }
.task-wrap { display: grid; gap: 8px; }
.q { border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r); padding: 14px 16px; margin: 0; display: grid; gap: 10px; min-width: 0; }
.q legend, .qlabel { font-weight: 700; padding: 0; }
fieldset.q legend { float: left; width: 100%; margin-bottom: 8px; }
.opts { display: grid; gap: 6px; clear: both; }
.opts.grid2 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.opts.row3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
input.num { width: 110px; font-size: 1.2rem; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); font-variant-numeric: tabular-nums; }
textarea, #t0-in { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px 10px; resize: vertical; }
.rows { display: grid; gap: 10px; }
@media (min-width: 1100px) { .rows.two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; } .rows.two .row-sel:nth-child(2) { border-top: 0; padding-top: 0; } }
.row-sel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.row-sel:first-child { border-top: 0; padding-top: 0; }
.row-ctrl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.row-label { width: 100%; font-weight: 700; font-size: .95rem; }
.sel { display: grid; gap: 2px; font-size: .78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
select { font-size: 1rem; padding: 7px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); min-width: 150px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); }
.mark { font-weight: 800; font-size: 1.2rem; min-width: 1.2em; }
.mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); }
.tf { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
.tf:first-of-type { border-top: 0; }
.tfbtn { display: flex; gap: 6px; }
.tfbtn label { cursor: pointer; }
.tfbtn input { position: absolute; opacity: 0; }
.tfbtn span { display: inline-block; padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--line); font-size: .9rem; font-weight: 700; background: var(--paper); }
.tfbtn input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tfbtn input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: r; }
.rank li { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; counter-increment: r; }
.rank li::before { content: counter(r); font-family: var(--f-mono); font-weight: 700; color: var(--accent); width: 1.4em; }
.rk-name { font-weight: 700; flex: 1; min-width: 0; }
.rk-btn { display: flex; gap: 4px; }
.mini { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; width: 38px; height: 34px; cursor: pointer; }

.btn { font-weight: 700; border-radius: 10px; padding: 10px 18px; border: 1.5px solid transparent; cursor: pointer; background: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); background: var(--sheet); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--bad); color: var(--sheet); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn:focus-visible, .nav-it:focus-visible, .mini:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions { margin-top: 4px; }

.tip { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.tip-h { font-weight: 700; color: var(--warn); }
.tip ul { margin: 4px 0 0; padding-left: 20px; }
.fb { border-radius: 10px; padding: 12px 16px; display: grid; gap: 6px; border: 1px solid; }
.fb.good { background: var(--ok-soft); border-color: var(--ok); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb.note { background: var(--warn-soft); border-color: transparent; }
.fb-h { font-family: var(--f-display); font-weight: 800; }
.corr { margin: 0; padding-left: 20px; }
.digit { font-family: var(--f-display); font-size: 2.4rem; font-weight: 800; color: var(--accent); vertical-align: middle; margin-left: 6px; }

.lock { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: var(--sheet); border: 2px solid var(--ink); border-radius: 16px; padding: 18px; max-width: 520px; }
.lockdig { display: grid; gap: 4px; text-align: center; font-family: var(--f-mono); font-weight: 700; color: var(--accent); }
.lockdig input { width: 58px; height: 68px; text-align: center; font-size: 2rem; font-family: var(--f-display); font-weight: 800; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); }
.badge { max-width: 460px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--sheet); display: grid; gap: 6px; padding: 0 0 18px; }
.badge > p { padding: 0 20px; }
.badge-top { background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 10px 20px !important; }
.badge-name { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; }
.badge-sk { color: var(--muted); font-size: .9rem; }
.mapwrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
svg.map { min-width: 640px; width: 100%; height: auto; }
.map .mbox { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; }
.map .mbox.neu { fill: var(--warn-soft); stroke: var(--oxy); stroke-dasharray: 6 4; }
.map .mt { font-family: var(--f-body); font-weight: 700; font-size: 19px; text-anchor: middle; fill: var(--ink); }
.map .ms { font-family: var(--f-body); font-size: 14px; text-anchor: middle; fill: var(--muted); }
.map .ma { stroke: var(--ok); stroke-width: 3.5; }
.map .ma.neu { stroke: var(--oxy); stroke-dasharray: 7 5; }
.map .mhk { fill: var(--ok); } .map .mhn { fill: var(--oxy); }
.map .ml { font-family: var(--f-body); font-weight: 700; font-size: 15px; fill: var(--ok); }
.map .ml.neu { fill: var(--oxy); font-size: 20px; }
.resultcard { margin-top: 16px; max-width: 560px; border-radius: 16px; overflow: hidden; border: 2px solid var(--accent); background: var(--sheet); display: grid; gap: 8px; padding-bottom: 16px; }
.resultcard > p, .resultcard > table { margin: 0 20px; }
.rt { border-collapse: collapse; width: calc(100% - 40px); font-size: .92rem; }
.rt th, .rt td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.next { background: var(--accent-soft); padding: 8px 12px !important; border-radius: 8px; }

.cheat { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 20, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.cheat-in { background: var(--sheet); border-radius: 16px; max-width: 820px; width: 100%; max-height: 88vh; overflow: auto; padding: 22px 24px; display: grid; gap: 12px; }
.cheat-in h2 { font-size: 1.4rem; }
.cheat-in h3 { font-size: 1.05rem; color: var(--accent); margin-top: 6px; }
.tablewrap { overflow-x: auto; }
.ct { border-collapse: collapse; width: 100%; font-size: .9rem; }
.ct th, .ct td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
.ct th { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cfig svg { max-height: 70px; width: auto; }
.suffix { font-family: var(--f-mono); font-weight: 700; color: var(--accent); white-space: nowrap; }
#navToggle { display: none; }
.target { font-family: var(--f-mono); font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 700; color: var(--accent); }
input.txt { width: 100%; max-width: 420px; font-family: var(--f-mono); font-size: 1.15rem; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); }
.nameq .paper { justify-content: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; clear: both; }
.pick { position: relative; display: grid; gap: 6px; border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: var(--sheet); }
.pick input { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; accent-color: var(--accent); }
.pick:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pickfig { display: flex; justify-content: center; padding-top: 18px; }
.pickfig svg { max-height: 150px; }
.pickno { font-weight: 700; text-align: center; font-size: .9rem; }
.memory { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mcard { aspect-ratio: 4 / 3; border: 2px solid var(--line); border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; padding: 6px; display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.mcard .back { font-family: var(--f-display); font-size: 2rem; font-weight: 800; }
.mcard .face { display: none; width: 100%; height: 100%; place-items: center; }
.mcard.open { background: var(--sheet); color: var(--ink); border-color: var(--accent); }
.mcard.open .back { display: none; } .mcard.open .face { display: grid; }
.mcard.found { border-color: var(--ok); background: var(--ok-soft); cursor: default; }
.memory.m8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.memory.m8 .mcard .mname { font-family: var(--f-body); font-size: .9rem; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; word-break: normal; }
@media (max-width: 860px) { .memory.m8 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.memory.m8 .mcard .face { min-height: 0; overflow: hidden; }
.memory.m8 .mcard .face svg { width: 100%; height: 100%; max-height: 100%; }
@media (max-width: 560px) { .memory.m8 .mcard .mname { font-size: .8rem; overflow-wrap: normal; } .memory.m8 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .memory.m8 .mcard { aspect-ratio: 3 / 2; } }
.stepnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }

<script>
/* ===== Chemie-Kern: Molekülmodell, Benennung, Generator ===== */
const STEMS = ['meth','eth','prop','but','pent','hex','hept','oct','non','dec'];
const MULT = ['', '', 'di', 'tri', 'tetra'];
const ALKYL = ['', 'methyl', 'ethyl', 'propyl', 'butyl'];
const cap = s => s.replace(/[a-zäöü]/, ch => ch.toUpperCase());
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const rint = (a, b) => a + rnd(b - a + 1);

function adjOf(mol) {
  const A = mol.atoms.map(() => []);
  mol.bonds.forEach(b => { A[b.a].push({ to: b.b, o: b.o }); A[b.b].push({ to: b.a, o: b.o }); });
  return A;
}

function isTree(mol) {
  const n = mol.atoms.length;
  if (!n) return false;
  if (mol.bonds.length !== n - 1) return false;
  const A = adjOf(mol); const seen = new Set([0]); const q = [0];
  while (q.length) { const x = q.pop(); for (const e of A[x]) if (!seen.has(e.to)) { seen.add(e.to); q.push(e.to); } }
  return seen.size === n;
}

function valenceProblems(mol) {
  const A = adjOf(mol); const out = [];
  mol.atoms.forEach((a, i) => {
    const s = A[i].reduce((t, e) => t + e.o, 0);
    const max = a.el === 'C' ? 4 : 2;
    if (s > max) out.push(i);
  });
  return out;
}

function canon(mol) {
  const A = adjOf(mol); const n = mol.atoms.length; if (!n) return '';
  let best = null;
  const f = (x, p) => {
    const ch = A[x].filter(e => e.to !== p).map(e => e.o + f(e.to, x)).sort();
    return mol.atoms[x].el + '(' + ch.join(',') + ')';
  };
  for (let r = 0; r < n; r++) { const s = f(r, -1); if (best === null || s < best) best = s; }
  return best;
}

function cmpArr(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i], y = b[i];
    if (x === undefined) return -1; if (y === undefined) return 1;
    if (Array.isArray(x)) { const c = cmpArr(x, y); if (c) return c; continue; }
    if (x < y) return -1; if (x > y) return 1;
  }
  return 0;
}

/* ---- Benennung ---- */
function nameMolecule(mol) {
  if (!mol || !mol.atoms.length || !isTree(mol) || valenceProblems(mol).length) return null;
  const A = adjOf(mol);
  const isC = i => mol.atoms[i].el === 'C';
  const C = mol.atoms.map((a, i) => i).filter(isC);
  if (!C.length) return null;
  const Os = mol.atoms.map((a, i) => i).filter(i => !isC(i));
  const handled = new Set(); const groups = [];
  for (const o of Os) {
    if (handled.has(o)) continue;
    const nb = A[o];
    if (nb.some(e => !isC(e.to))) return null;
    if (nb.length === 1 && nb[0].o === 2) {
      const c = nb[0].to;
      const otherO = A[c].filter(e => !isC(e.to) && e.to !== o);
      const cN = A[c].filter(e => isC(e.to));
      if (otherO.length > 1) return null;
      if (otherO.length === 1) {
        const o2 = otherO[0].to; if (otherO[0].o !== 1) return null;
        handled.add(o2);
        const o2C = A[o2].filter(e => isC(e.to) && e.to !== c);
        if (A[o2].length === 1) groups.push({ type: 'acid', c });
        else if (A[o2].length === 2 && o2C.length === 1) groups.push({ type: 'ester', c, alkC: o2C[0].to });
        else return null;
      } else groups.push({ type: cN.length <= 1 ? 'ald' : 'ket', c });
      handled.add(o);
    } else if (nb.length === 1 && nb[0].o === 1) {
      const c = nb[0].to;
      if (A[c].some(e => !isC(e.to) && e.o === 2)) continue;
      groups.push({ type: 'ol', c }); handled.add(o);
    } else if (nb.length === 2 && nb.every(e => e.o === 1)) {
      continue; // Ester-Brücke, wird über C=O erfasst
    } else return null;
  }
  if (!Os.every(o => handled.has(o))) return null;
  if (groups.length > 1) return null;
  const g = groups[0] || null;
  if (g && g.type === 'ester') return nameEster(mol, A, g);

  const mbs = mol.bonds.filter(b => b.o > 1 && isC(b.a) && isC(b.b));
  if (mbs.length > 1) return null;
  if (mbs.length && g) return null;
  const mb = mbs[0] || null;

  const CA = {}; C.forEach(c => CA[c] = A[c].filter(e => isC(e.to)).map(e => e.to));
  const bondO = (x, y) => { const e = A[x].find(e => e.to === y); return e ? e.o : 0; };
  const hasO = x => A[x].some(e => !isC(e.to));

  const cands = [];
  for (const u of C) {
    const par = { [u]: -1 }; const q = [u];
    while (q.length) { const x = q.shift(); for (const y of CA[x]) if (!(y in par)) { par[y] = x; q.push(y); } }
    for (const v of C) {
      const path = []; let x = v; while (x !== -1) { path.push(x); x = par[x]; } path.reverse();
      const pos = new Map(path.map((a, i) => [a, i + 1]));
      if (g && !pos.has(g.c)) continue;
      const fgLocs = g ? [pos.get(g.c)] : [];
      let mbLocs = [];
      if (mb && pos.has(mb.a) && pos.has(mb.b) && Math.abs(pos.get(mb.a) - pos.get(mb.b)) === 1) mbLocs = [Math.min(pos.get(mb.a), pos.get(mb.b))];
      const subs = []; let bad = false;
      for (const ca of path) for (const r of CA[ca]) {
        if (pos.has(r)) continue;
        let prev = ca, cur = r, len = 0, ok = true;
        while (true) {
          len++;
          if (hasO(cur)) ok = false;
          if (bondO(prev, cur) > 1) ok = false;
          const nx = CA[cur].filter(y => y !== prev);
          if (nx.length > 1) { ok = false; break; }
          if (!nx.length) break;
          prev = cur; cur = nx[0];
        }
        if (!ok || len > 4) bad = true;
        subs.push({ name: ok && len <= 4 ? ALKYL[len] : '?', loc: pos.get(ca), len });
      }
      const subLocs = subs.map(s => s.loc).sort((a, b) => a - b);
      const alpha = subs.slice().sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : a.loc - b.loc).map(s => s.loc);
      cands.push({ path, fgLocs, mbLocs, subs, subLocs, alpha, bad, len: path.length });
    }
  }
  if (!cands.length) return null;
  const keyA = c => [-c.len, -c.mbLocs.length, c.fgLocs, c.mbLocs, -c.subs.length, c.subLocs, c.alpha];
  const keyB = c => [-c.len, -c.mbLocs.length, -c.subs.length, c.fgLocs, c.mbLocs, c.subLocs, c.alpha];
  const best = k => cands.slice().sort((x, y) => cmpArr(k(x), k(y)))[0];
  const bA = best(keyA), bB = best(keyB);
  const res = assemble(bA, g, mb);
  if (!res) return null;
  const resB = assemble(bB, g, mb);
  if (!resB || resB.name !== res.name) return null;
  if (mb && !bA.mbLocs.length) return null;
  if (bA.bad) return null;
  return res;
}

function assemble(c, g, mb) {
  const n = c.len; if (n > 10) return null;
  const stem = STEMS[n - 1];
  const groups = {};
  c.subs.forEach(s => { (groups[s.name] = groups[s.name] || []).push(s.loc); });
  const names = Object.keys(groups).sort();
  if (names.some(nm => groups[nm].length > 4)) return null;
  const prefix = names.map(nm => groups[nm].sort((a, b) => a - b).join(',') + '-' + MULT[groups[nm].length] + nm).join('-');
  let cls = 'alkan', mbLoc = null, fgLoc = null, mbType = null;
  if (mb) { cls = mb.o === 2 ? 'alken' : 'alkin'; mbType = mb.o === 2 ? 'en' : 'in'; mbLoc = c.mbLocs[0]; }
  if (g) { cls = { ol: 'alkohol', ald: 'aldehyd', ket: 'keton', acid: 'saeure' }[g.type]; fgLoc = c.fgLocs[0]; }
  const omitOK = (cls === 'alken' || cls === 'alkin') ? n <= 3 : cls === 'alkohol' ? n <= 2 : cls === 'keton' ? n <= 4 : true;
  const build = (style, omit) => {
    const p = prefix;
    let s;
    if (cls === 'alkan') s = p + stem + 'an';
    else if (cls === 'aldehyd') s = p + stem + 'anal';
    else if (cls === 'saeure') s = p + stem + 'ansäure';
    else {
      const suf = mbType || (cls === 'alkohol' ? 'ol' : 'on');
      const base = mbType ? stem : stem + 'an';
      const loc = mbType ? mbLoc : fgLoc;
      if (omit) s = p + base + suf;
      else if (style === 'new') s = p + base + '-' + loc + '-' + suf;
      else s = p + (p ? '-' : '') + loc + '-' + base + suf;
    }
    return cap(s);
  };
  const name = build('new', omitOK);
  const acc = new Set([build('new', false), build('old', false)]);
  if (omitOK) { acc.add(build('new', true)); }
  acc.add(name);
  return {
    name, accepted: [...acc], cls, n, stem, chain: c.path, subs: c.subs.map(s => ({ name: s.name, loc: s.loc })),
    groups, mbLoc, mbType, fgLoc, fgType: g ? g.type : null, prefix
  };
}

function nameEster(mol, A, g) {
  const isC = i => mol.atoms[i].el === 'C';
  const comp = (start) => {
    const seen = new Set([start]); const q = [start];
    while (q.length) { const x = q.pop(); for (const e of A[x]) if (isC(e.to) && !seen.has(e.to)) { seen.add(e.to); q.push(e.to); } }
    return [...seen];
  };
  const straight = (atoms, end) => {
    const set = new Set(atoms);
    for (const a of atoms) {
      const cn = A[a].filter(e => set.has(e.to));
      if (cn.length > 2 || cn.some(e => e.o > 1)) return false;
      if (a !== g.c && A[a].some(e => !isC(e.to))) {
        if (!(a === g.alkC)) return false;
      }
    }
    return A[end].filter(e => set.has(e.to)).length <= 1;
  };
  const acid = comp(g.c), alk = comp(g.alkC);
  if (!straight(acid, g.c) || !straight(alk, g.alkC)) return null;
  if (acid.length > 10 || alk.length > 4) return null;
  const aStem = STEMS[acid.length - 1];
  const name = cap(aStem + 'ansäure' + ALKYL[alk.length] + 'ester');
  const iupac = cap(ALKYL[alk.length] + aStem + 'anoat');
  return {
    name, alt: iupac, accepted: [name, iupac], cls: 'ester', n: acid.length, m: alk.length, stem: aStem,
    chain: orderPath(A, acid, g.c, isC), alkChain: orderPath(A, alk, g.alkC, isC), subs: [], groups: {}, fgType: 'ester'
  };
}
function orderPath(A, atoms, start, isC) {
  const set = new Set(atoms); const out = [start]; let prev = -1, cur = start;
  while (true) { const nx = A[cur].filter(e => set.has(e.to) && e.to !== prev); if (!nx.length) break; prev = cur; cur = nx[0].to; out.push(cur); }
  return out;
}

/* ---- Antwortprüfung ---- */
const TRIVIAL = {
  'essigsäure': 'Ethansäure', 'ameisensäure': 'Methansäure', 'aceton': 'Propanon', 'azeton': 'Propanon',
  'acetaldehyd': 'Ethanal', 'formaldehyd': 'Methanal', 'ethylen': 'Ethen', 'acetylen': 'Ethin',
  'ethylacetat': 'Ethansäureethylester', 'essigsäureethylester': 'Ethansäureethylester', 'isopropanol': 'Propan-2-ol',
  'buttersäure': 'Butansäure', 'propionsäure': 'Propansäure', 'methylalkohol': 'Methanol', 'ethylalkohol': 'Ethanol',
  'essigester': 'Ethansäureethylester', 'isobutan': '2-Methylpropan'
};
function norm(s) {
  return s.toLowerCase().normalize('NFC').replace(/[‐-―−]/g, '-').replace(/ae/g, 'ä')
    .replace(/\s+/g, '').replace(/\.$/, '');
}
const ENDING = { alkan: 'an', alken: 'en', alkin: 'in', alkohol: 'ol', aldehyd: 'al', keton: 'on', saeure: 'säure', ester: '' };
function checkName(input, info) {
  const raw0 = (input || '').trim();
  if (!raw0) return { status: 'empty' };
  const raw = raw0.normalize('NFC').replace(/[‐-―−]/g, '-').replace(/\.$/, '');
  const x = norm(raw);
  const acc = info.accepted.map(norm);
  const ae = s => s.replace(/ä/g, 'ae');
  if (acc.includes(x)) {
    if (info.accepted.some(a => ae(a) === ae(raw))) return { status: 'correct' };
    if (/\s/.test(raw)) return { status: 'hint', msg: 'Regel 8: Der Name wird in einem Wort geschrieben, ohne Leerzeichen.' };
    return { status: 'hint', msg: 'Regel 8: Achte auf Groß- und Kleinschreibung. Der Name beginnt mit einem Großbuchstaben (bei Zahlen am Anfang: der erste Buchstabe), alles andere wird kleingeschrieben – z. B. 2-Methylbutan.' };
  }
  const strip = s => s.replace(/[-,]/g, '');
  if (acc.map(strip).includes(strip(x))) return { status: 'hint', msg: 'Regel 8: Prüfe Komma und Bindestrich. Zahlen untereinander mit Komma (2,3), zwischen Zahl und Buchstabe ein Bindestrich (2-Methyl, But-1-en).' };
  const triv = TRIVIAL[x];
  if (triv && norm(triv) === norm(info.name)) return { status: 'hint', msg: '„' + raw + '“ ist ein Trivialname. Gesucht ist der systematische Name nach IUPAC.' };
  const noDigits = s => strip(s).replace(/\d/g, '');
  let diag = '';
  const end = ENDING[info.cls];
  if (end && !x.endsWith(end)) diag = 'Regel ' + (info.fgType ? '9' : '1') + ': Prüfe die Stoffklasse. Die Endung muss hier „-' + end + '“ lauten.';
  else if (acc.some(a => noDigits(a) === noDigits(x))) diag = /\d/.test(x) ? 'Regel 4: Die Bausteine stimmen, aber die Nummerierung nicht. Nummeriere vom anderen Ende, wenn dann kleinere Zahlen entstehen.' : 'Regel 5: Die Nummern (Positionsangaben) fehlen.';
  else if (info.subs && info.subs.length > 1) {
    const sortL = s => strip(s).replace(/\d/g, '').split('').sort().join('');
    if (acc.some(a => sortL(a) === sortL(x))) diag = 'Regel 7: Prüfe die Reihenfolge. Seitenketten werden alphabetisch geordnet (Ethyl vor Methyl), di/tri zählen dabei nicht.';
  }
  if (!diag && info.stem && !x.includes(info.stem)) diag = 'Regel 2: Zähle die längste Kette noch einmal. Sie hat ' + info.n + ' C-Atome (Stamm ' + cap(info.stem) + '-).';
  return { status: 'wrong', diag };
}

function checkDrawing(mol, target) {
  if (!mol.atoms.length) return { status: 'invalid', msg: 'Das Zeichenfeld ist noch leer.' };
  const vp = valenceProblems(mol);
  if (vp.length) return { status: 'invalid', msg: 'Ein Atom hat zu viele Bindungen (C höchstens 4, O höchstens 2). Es ist rot markiert.', bad: vp };
  if (mol.bonds.length >= mol.atoms.length) return { status: 'invalid', msg: 'Deine Zeichnung enthält einen Ring. In diesem Trainer kommen nur Ketten vor.' };
  if (!isTree(mol)) return { status: 'invalid', msg: 'Nicht alle Atome sind miteinander verbunden.' };
  if (canon(mol) === canon(target)) return { status: 'correct' };
  const cnt = (m, el) => m.atoms.filter(a => a.el === el).length;
  const notes = [];
  const cS = cnt(mol, 'C'), cT = cnt(target, 'C'), oS = cnt(mol, 'O'), oT = cnt(target, 'O');
  if (cS !== cT) notes.push('Du hast ' + cS + ' C-Atome gezeichnet, gesucht sind ' + cT + '.');
  if (oS !== oT) notes.push('Du hast ' + oS + ' O-Atom' + (oS === 1 ? '' : 'e') + ' gezeichnet, gesucht ' + (oT === 1 ? 'ist 1' : 'sind ' + oT) + '.');
  const own = nameMolecule(mol);
  return { status: 'wrong', notes, ownName: own ? own.name : null };
}

/* ---- Aufbau aus einer Beschreibung (Spec) ---- */
function buildMol(spec) {
  if (spec.ester) return buildEster(spec);
  const atoms = [], bonds = [];
  const occ = new Map();
  const k = (x, y) => x + ',' + y;
  const add = (el, x, y) => { if (occ.has(k(x, y))) throw 'overlap'; atoms.push({ el, x, y }); occ.set(k(x, y), atoms.length - 1); return atoms.length - 1; };
  const bond = (a, b, o) => bonds.push({ a, b, o });
  const n = spec.n; const main = [];
  const bend = spec.bend || null;
  const vdir = bend ? bend.dir : 0;
  try {
    if (bend && bend.end === 'start') {
      for (let j = 1; j <= bend.k; j++) main.push(add('C', 0, vdir * (bend.k + 1 - j)));
      for (let j = bend.k + 1; j <= n; j++) main.push(add('C', j - bend.k - 1, 0));
    } else if (bend && bend.end === 'end') {
      const h = n - bend.k;
      for (let j = 1; j <= h; j++) main.push(add('C', j - 1, 0));
      for (let j = h + 1; j <= n; j++) main.push(add('C', h - 1, vdir * (j - h)));
    } else for (let j = 1; j <= n; j++) main.push(add('C', j - 1, 0));

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
/* ---------- Strukturformeln (Lewis: alle H-Atome, freie Elektronenpaare) ---------- */
const G = 56;
function renderMol(mol, opts = {}) {
  const fake = { atoms: mol.atoms.map(a => ({ ...a, el: a.el === 'R' ? 'C' : a.el })), bonds: mol.bonds };
  const Hs = hydrogens(fake).filter(h => !['*', 'R'].includes(mol.atoms[h.atom].el));
  const LP = lonePairs(mol, Hs);
  const pts = mol.atoms.map(a => [a.x * G, a.y * G]);
  const hpos = Hs.map(h => { const a = mol.atoms[h.atom]; const f = h.crowded ? 0.33 : 0.52; return [a.x * G + h.dx * G * f, a.y * G + h.dy * G * f, h]; });
  hpos.forEach(p => pts.push([p[0], p[1]]));
  LP.forEach(l => { const a = mol.atoms[l.atom]; pts.push([a.x * G + l.dx * G * 0.3, a.y * G + l.dy * G * 0.3]); });
  const pad = opts.pad || 16;
  const minX = Math.min(...pts.map(p => p[0])) - pad, maxX = Math.max(...pts.map(p => p[0])) + pad;
  const minY = Math.min(...pts.map(p => p[1])) - pad, maxY = Math.max(...pts.map(p => p[1])) + pad;
  const w = maxX - minX, h = maxY - minY;
  const R = el => el === '*' ? -4 : (el === 'C' || el === 'O' || el === 'R') ? 9 : 7;
  const line = (x1, y1, x2, y2, r1, r2, cls) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    return `<line class="${cls || 'bd'}" x1="${(x1 + ux * r1).toFixed(1)}" y1="${(y1 + uy * r1).toFixed(1)}" x2="${(x2 - ux * r2).toFixed(1)}" y2="${(y2 - uy * r2).toFixed(1)}"/>`;
  };
  let s = '';
  mol.bonds.forEach(b => {
    const a = mol.atoms[b.a], c = mol.atoms[b.b];
    const x1 = a.x * G, y1 = a.y * G, x2 = c.x * G, y2 = c.y * G;
    if (b.o === 1) s += line(x1, y1, x2, y2, R(a.el), R(c.el));
    else {
      const L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
      (b.o === 2 ? [-3.2, 3.2] : [-5, 0, 5]).forEach(o => { s += line(x1 + nx * o, y1 + ny * o, x2 + nx * o, y2 + ny * o, R(a.el), R(c.el)); });
    }
  });
  hpos.forEach(([hx, hy, hh]) => { const a = mol.atoms[hh.atom]; s += line(a.x * G, a.y * G, hx, hy, R(a.el), 6.5, 'bd bh'); });
  LP.forEach(l => {
    const a = mol.atoms[l.atom]; const cx = a.x * G + l.dx * G * 0.25, cy = a.y * G + l.dy * G * 0.25, px = -l.dy * G * 0.1, py = l.dx * G * 0.1;
    s += `<line class="lp" x1="${(cx - px).toFixed(1)}" y1="${(cy - py).toFixed(1)}" x2="${(cx + px).toFixed(1)}" y2="${(cy + py).toFixed(1)}"/>`;
  });
  mol.atoms.forEach(a => { if (a.el !== '*') s += `<text class="at at-${a.el}" x="${a.x * G}" y="${a.y * G}">${a.el}</text>`; });
  hpos.forEach(([hx, hy]) => { s += `<text class="at at-H" x="${hx.toFixed(1)}" y="${hy.toFixed(1)}">H</text>`; });
  (opts.numbers || []).forEach((ai, i) => { const a = mol.atoms[ai]; s += `<text class="num" x="${a.x * G + 16}" y="${a.y * G - 16}">${i + 1}</text>`; });
  const scale = opts.scale || 1;
  return `<svg class="mol" viewBox="${minX.toFixed(1)} ${minY.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" width="${(w * scale).toFixed(0)}" role="img" aria-label="${esc(opts.label || 'Strukturformel')}">${s}</svg>`;
}

// Kugelmodell: C mit vier verschiedenen Partnern, gespiegelt
function ballModel(mirror) {
  const sx = mirror ? -1 : 1;
  const bonds = [[0, -70, '#F2F2EE', 'weiß'], [-62 * sx, 38, '#C4352B', 'rot'], [62 * sx, 38, '#2E8B57', 'grün'], [18 * sx, 22, '#E2B007', 'gelb']];
  let s = '';
  bonds.forEach(([x, y]) => { s += `<line x1="0" y1="0" x2="${x}" y2="${y}" class="stick"/>`; });
  bonds.slice(0, 3).forEach(([x, y, c]) => { s += `<circle cx="${x}" cy="${y}" r="22" fill="${c}" class="ball"/>`; });
  s += `<circle cx="0" cy="0" r="26" fill="#22272E" class="ball"/>`;
  const [x, y, c] = bonds[3]; s += `<circle cx="${x * 1.9}" cy="${y * 1.9}" r="17" fill="${c}" class="ball front"/><line x1="0" y1="0" x2="${x * 1.9}" y2="${y * 1.9}" class="stick"/>`;
  return `<svg class="balls" viewBox="-110 -110 220 200" role="img" aria-label="Kugelmodell: schwarzes C-Atom mit vier verschiedenfarbigen Kugeln${mirror ? ', Spiegelbild' : ''}">${s}</svg>`;
}

T.nameset = {
  render: (t, id) => `<div class="q" id="${id}"><p class="qlabel">${t.q}</p><div class="slots">${t.slots.map((s, i) => `<div class="slot"><label for="${id}-${i}">${s.label}</label><input class="txt" id="${id}-${i}" type="text" spellcheck="false" autocapitalize="off" autocomplete="off"><span class="mark" id="${id}-${i}-m" aria-hidden="true"></span><p class="slotmsg" id="${id}-${i}-msg"></p></div>`).join('')}</div></div>`,
  read: (id, t) => t.slots.map((s, i) => $(`#${id}-${i}`).value.trim()),
  eval(t, v) {
    const used = new Set();
    return t.slots.map((s, i) => {
      const x = v[i]; if (!x) return { ok: false, msg: '' };
      const hit = s.pool.find(k => nameOk(x, k) && !(t.distinct && used.has(k)));
      if (hit) { used.add(hit); return { ok: true, key: hit }; }
      if (t.distinct && s.pool.some(k => nameOk(x, k))) return { ok: false, msg: 'Dieses Molekül habt ihr schon genannt.' };
      const other = (t.others || []).find(([k]) => nameOk(x, k)); if (other) return { ok: false, msg: other[1] };
      const hint = s.pool.map(k => checkName(x, M(k).info)).find(r => r.status === 'hint'); if (hint) return { ok: false, msg: noRule(hint.msg) };
      return { ok: false, msg: t.wrongMsg || 'Passt nicht. Prüft den Namen und die Summenformel.' };
    });
  },
  ok(t, v) { return this.eval(t, v).every(r => r.ok); },
  mark(t, v, id) { this.eval(t, v).forEach((r, i) => { const m = $(`#${id}-${i}-m`); m.textContent = v[i] ? (r.ok ? '✓' : '✗') : ''; m.className = 'mark ' + (r.ok ? 'ok' : 'bad'); $(`#${id}-${i}-msg`).textContent = r.ok ? '' : (r.msg || ''); }); },
  fill(t, id) {
    const res = this.eval(t, this.read(id, t)), used = new Set(res.filter(r => r.ok).map(r => r.key));
    t.slots.forEach((s, i) => { if (res[i].ok) return; const k = s.pool.find(k => !used.has(k)) || s.pool[0]; used.add(k); $(`#${id}-${i}`).value = nameOf(k); });
  },
};

      <div class="memory m8" data-pairs="${t.keys.length}" data-found="0" data-moves="0">${cards.map((c, i) => `<button type="button" class="mcard" data-k="${c.k}" data-i="${i}" aria-label="Verdeckte Karte ${i + 1}"><span class="back" aria-hidden="true">?</span><span class="face">${c.kind === 's' ? mol(c.k, { pad: 10 }) : `<span class="mname">${nameOf(c.k)}</span>`}</span></button>`).join('')}</div></div>`;
  },
  read: id => +document.querySelector(`#${id} .memory`).dataset.found,
  ok: (t, v) => v === t.keys.length,
  fill: (t, id) => { const m = document.querySelector(`#${id} .memory`); m.querySelectorAll('.mcard').forEach(c => c.classList.add('open', 'found')); m.dataset.found = t.keys.length; },
};
T.pick = {
  render: (t, id) => `<fieldset class="q" id="${id}"><legend>${t.q}</legend><div class="pickgrid">${t.show.map((k, i) => `<label class="pick"><input type="checkbox" name="${id}" value="${i}"><span class="pickfig">${mol(k)}</span><span class="pickno">Molekül ${i + 1}</span></label>`).join('')}</div></fieldset>`,
  read: id => [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x => +x.value),
  ok: (t, v) => JSON.stringify(v) === JSON.stringify(t.show.map((k, i) => t.correct.includes(k) ? i : -1).filter(i => i >= 0)),
  fill: (t, id) => { document.querySelectorAll(`input[name="${id}"]`).forEach(x => { x.checked = t.correct.includes(t.show[+x.value]); }); },
};
T.mc.fill = (t, id) => { document.querySelectorAll(`input[name="${id}"]`).forEach(x => { x.checked = +x.value === t.a; }); };
T.num.fill = (t, id) => { $(`#${id}-in`).value = t.a; };
document.addEventListener('click', e => {
  const c = e.target.closest('.mcard'); if (!c || c.disabled || c.classList.contains('found') || c.classList.contains('open')) return;
  const m = c.closest('.memory'); if (m.dataset.lock === '1') return;
  c.classList.add('open'); c.setAttribute('aria-label', 'Aufgedeckte Karte');
  const open = [...m.querySelectorAll('.mcard.open:not(.found)')];

      if (+m.dataset.found === +m.dataset.pairs) setTimeout(() => check(false), 400);

const KEY = 'startklar-organik.v3', CODE = '0408';
const fresh = () => ({ team: '', done: {}, cur: 0, tips: 0, steps: {}, at: {}, unlock: false, solved: {} });
let st = fresh();
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && typeof x === 'object') st = Object.assign(fresh(), x); } catch (e) { }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } };
const skey = (sid, i) => sid + ':' + i;
function serialize() {
  const o = {}; document.querySelectorAll('#stepForm input, #stepForm select, #stepForm textarea').forEach(el => {
    if (el.type === 'radio' || el.type === 'checkbox') { if (el.id) o['#' + el.id] = el.checked; else if (el.checked) o[el.name + '=' + el.value] = true; }
    else if (el.id) o['#' + el.id] = el.value;
  }); return o;
}
function restore(o) {
  if (!o) return; Object.entries(o).forEach(([k, v]) => {
    if (k[0] === '#') { const el = document.getElementById(k.slice(1)); if (!el) return; if (el.type === 'checkbox' || el.type === 'radio') el.checked = !!v; else el.value = v; }
    else { const i = k.lastIndexOf('='); const el = document.querySelector(`#stepForm input[name="${k.slice(0, i)}"][value="${k.slice(i + 1)}"]`); if (el) el.checked = true; }
  });
  document.querySelectorAll('#stepForm input[id$="-rev"]').forEach(el => { if (el.checked) showSol(el.id.replace(/-rev$/, '')); });
}
function saveDraft() {
  const s = STATIONS[st.cur]; if (!s || !s.steps[stepIdx] || !$('#stepForm')) return; const k = skey(s.id, stepIdx);
  if (st.steps[k] && st.steps[k].ok) return;
  st.steps[k] = Object.assign(st.steps[k] || {}, { form: serialize() }); save();
}
document.addEventListener('input', e => { if (e.target.closest('#stepForm')) saveDraft(); });
document.addEventListener('change', e => { if (e.target.closest('#stepForm')) saveDraft(); });

/* ---------- Ablauf ---------- */
let stepIdx = 0, attempts = {}, tipIdx = {};
const stepOk = (s, i) => !!(st.steps[skey(s.id, i)] && st.steps[skey(s.id, i)].ok);
const firstOpen = s => { const i = s.steps.findIndex((x, j) => !stepOk(s, j)); return i < 0 ? 0 : i; };
function maxReachable() { if (st.unlock) return STATIONS.length - 1; let i = 0; while (i < STATIONS.length - 1 && st.done[STATIONS[i].id]) i++; return i; }
function maxStep(s) { if (st.unlock) return s.steps.length - 1; let i = 0; while (i < s.steps.length - 1 && stepOk(s, i)) i++; return i; }
function renderNav() {
  const total = STATIONS.length - 2, done = STATIONS.slice(1, -1).filter(s => st.done[s.id]).length;
  $('#progressBar').style.width = (done / total * 100) + '%';
  $('#progressTxt').textContent = done + ' von ' + total + ' Stationen';
  $('#nav').innerHTML = STATIONS.map((s, i) => {
    const state = st.done[s.id] ? 'done' : (i <= maxReachable() ? 'open' : 'locked');
    return `<li><button class="nav-it ${state}${i === st.cur ? ' cur' : ''}" data-go="${i}" ${state === 'locked' ? 'disabled' : ''}><span class="nav-no">${state === 'done' ? '✓' : (i === 0 ? '•' : s.id === 'ende' ? '★' : i)}</span><span class="nav-t">${s.title}</span>${/Baukasten/.test(s.kind) ? '<span class="nav-code">Bau</span>' : ''}</button></li>`;
  }).join('') + (st.unlock ? '<li class="unlockbadge">Alle Stationen freigeschaltet</li>' : '');
  $('#cheatBtn').hidden = !st.done.start && !st.unlock;
}
function goStation(i, step) { st.cur = i; const s = STATIONS[i]; stepIdx = step !== undefined ? step : (s.steps.length ? firstOpen(s) : 0); st.at[s.id] = stepIdx; save(); renderStation(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b && !b.disabled) { goStation(+b.dataset.go); document.body.classList.remove('navopen'); return; }
  const p = e.target.closest('[data-step]'); if (p && !p.disabled) { stepIdx = +p.dataset.step; st.at[STATIONS[st.cur].id] = stepIdx; save(); renderStation(); return; }
  if (e.target.closest('#backBtn')) { if (stepIdx > 0 && STATIONS[st.cur].steps.length) { stepIdx--; st.at[STATIONS[st.cur].id] = stepIdx; save(); renderStation(); window.scrollTo(0, 0); } else if (st.cur > 0) { const j = st.cur - 1; goStation(j, Math.max(0, STATIONS[j].steps.length - 1)); } }
});
function renderStation() {
  renderNav();
  const i = st.cur, s = STATIONS[i], box = $('#main');
  const head = `<header class="st-head"><p class="eyebrow">${s.id === 'ende' ? 'Ende' : s.id === 'start' ? 'Willkommen' : `Station ${i} von ${STATIONS.length - 2}`} · <span class="kind ${/Baukasten/.test(s.kind) ? 'kit' : ''}">${s.kind}</span>${s.min ? ` · ca. ${s.min} Min.` : ''}</p><h2>${s.title}</h2></header>`;
  if (s.id === 'ende') { box.innerHTML = head + endeHTML() + `<div class="row actions"><button class="btn ghost" type="button" id="backBtn">← Zurück</button></div>`; return; }
  if (stepIdx >= s.steps.length) stepIdx = 0;
  const step = s.steps[stepIdx], k = skey(s.id, stepIdx), saved = st.steps[k] || {};
  const ms = maxStep(s);
  const nav = s.steps.length > 1 ? `<nav class="stepnav" aria-label="Teile dieser Station"><span class="lbl">Teil</span>${s.steps.map((x, j) => `<button type="button" class="sp${j === stepIdx ? ' cur' : ''}${stepOk(s, j) ? ' done' : ''}${x.input ? ' inp' : ''}" data-step="${j}" ${j > ms ? 'disabled' : ''} aria-label="Teil ${j + 1}${x.input ? ' (Input)' : ''}">${x.input ? 'Input' : j + 1}</button>`).join('')}</nav>` : '';
  box.innerHTML = head + nav + `<div class="step">${step.intro()}<form id="stepForm" class="tasks" autocomplete="off">${step.tasks.map((t, j) => `<div class="task-wrap" data-k="${j}">${T[t.type].render(t, `t${j}`)}<div class="tips" id="tips${j}"></div><div class="tfb" id="fb${j}"></div></div>`).join('')}
    <div class="row actions">${(st.cur > 0 || stepIdx > 0) ? '<button class="btn ghost" type="button" id="backBtn">← Zurück</button>' : ''}<button class="btn primary" type="submit" id="check">${step.tasks[0].type === 'memory' ? 'Fertig' : 'Prüfen'}</button>${step.tasks.some(t => t.tips) ? '<button class="btn ghost" type="button" id="tipBtn">Tipp</button>' : ''}<button class="btn ghost" type="button" id="solBtn" ${st.unlock ? '' : 'hidden'}>Lösung ansehen</button></div>
    <div id="stepFb" aria-live="polite"></div></form></div>`;
  if (step.tasks[0].key === 'team') $('#t0-in').value = st.team || '';
  attempts[k] = attempts[k] || 0; tipIdx[k] = 0;
  restore(saved.form);
  $('#stepForm').addEventListener('submit', ev => { ev.preventDefault(); check(false); });
  const tb = $('#tipBtn'); if (tb) tb.onclick = showTip;
  $('#solBtn').onclick = () => check(true);
  if (saved.ok) check(!!saved.rev, true);
}
function showTip() {
  const s = STATIONS[st.cur], step = s.steps[stepIdx], key = skey(s.id, stepIdx);
  const all = []; step.tasks.forEach((t, k) => (t.tips || []).forEach(tp => all.push([k, tp])));
  const n = Math.min(++tipIdx[key], all.length);
  step.tasks.forEach((t, k) => { const mine = all.slice(0, n).filter(x => x[0] === k).map(x => x[1]); $(`#tips${k}`).innerHTML = mine.length ? `<div class="tip"><p class="tip-h">Tipp</p><ul>${mine.map(m => `<li>${m}</li>`).join('')}</ul></div>` : ''; });
  st.tips = (st.tips || 0) + 1; save();
  if (n >= all.length) $('#tipBtn').disabled = true;
}
function check(reveal, replay) {
  const s = STATIONS[st.cur], step = s.steps[stepIdx], key = skey(s.id, stepIdx);
  if (!step) return;
  let allOk = true, missing = false, paperMissing = false;
  step.tasks.forEach((t, k) => {
    const id = `t${k}`, tt = T[t.type];
    if (reveal || (replay && t.type === 'memory')) { if (tt.fill) tt.fill(t, id); }
    const v = tt.read(id, t);
    if (t.key === 'team') st.team = (v || '').trim();
    const empty = t.type === 'paper' ? v === null : (t.type !== 'memory' && t.type !== 'pick' && t.type !== 'text' && (v === null || (Array.isArray(v) && v.some(x => x === null || x === '' || (Array.isArray(x) && x.some(y => y === ''))))));
    const ok = !empty && tt.ok(t, v);
    if (empty && !reveal) { missing = true; if (t.type === 'paper') paperMissing = true; }
    if (!ok) allOk = false;
    if (t.type === 'sel') t.rows.forEach((r, i) => { const m = document.querySelector(`#${id} .row-sel[data-i="${i}"] .mark`); const rk = tt.rowOk(t, v, i); m.textContent = rk ? '✓' : '✗'; m.className = 'mark ' + (rk ? 'ok' : 'bad'); });
    if (t.type === 'nameset') tt.mark(t, v, id);
    const fb = $(`#fb${k}`);
    if (ok || reveal) {
      const f = typeof t.fb === 'function' ? t.fb() : (t.fb || '');
      const extra = t.type === 'name' ? `<p>${reveal && !ok ? 'Lösung' : 'Richtig'}: <b>${nameOf(t.key)}</b></p>` : '';
      fb.innerHTML = (f || extra) ? `<div class="fb good">${extra}${f ? (f.startsWith('<') ? f : `<p>${f}</p>`) : ''}</div>` : '';
    } else if (!empty) {
      let msg = 'Das stimmt noch nicht.', cls = 'bad';
      if (t.type === 'name') { const r = checkName(v, M(t.key).info); if (r.status === 'hint') { msg = noRule(r.msg); cls = 'note'; } else if (r.diag) msg += ' ' + noRule(r.diag); }
      if (t.type === 'memory') msg = 'Es fehlen noch Paare.';
      fb.innerHTML = t.type === 'nameset' ? '' : `<div class="fb ${cls}"><p>${msg}</p></div>`;
    } else fb.innerHTML = '';
  });
  const sfb = $('#stepFb');
  if (missing && !allOk) { sfb.innerHTML = `<div class="fb note"><p>${paperMissing ? 'Deckt die Lösung auf, vergleicht mit eurer Zeichnung und kreuzt an, wie es lief.' : 'Beantwortet zuerst alle Fragen.'}</p></div>`; return; }
  if (allOk || reveal) {
    if (!replay) {
      st.steps[key] = { form: serialize(), ok: true, rev: !!reveal };
      if (reveal) st.solved[s.id] = true;
    }
    document.querySelectorAll('#stepForm input, #stepForm select, #stepForm .mini, #stepForm [data-reveal], #stepForm .mcard').forEach(x => { if (step.tasks[0].key !== 'team') x.disabled = true; });
    $('#check').hidden = true; const tb = $('#tipBtn'); if (tb) tb.hidden = true; $('#solBtn').hidden = true;
    const last = stepIdx + 1 >= s.steps.length;
    sfb.innerHTML = `${replay && reveal ? '<p class="small">Diese Aufgabe wurde mit „Lösung ansehen“ erledigt.</p>' : ''}<div class="row actions"><button class="btn primary" type="button" id="goOn">${last ? (st.cur + 1 < STATIONS.length - 1 ? 'Weiter zur nächsten Station' : 'Zur Ergebniskarte') : 'Weiter zu Teil ' + (stepIdx + 2)}</button></div>`;
    $('#goOn').onclick = () => {
      if (last) { st.done[s.id] = { solved: !!st.solved[s.id] }; goStation(Math.min(st.cur + 1, STATIONS.length - 1)); }
      else { stepIdx++; st.at[s.id] = stepIdx; save(); renderStation(); window.scrollTo(0, 0); }
    };
    if (!replay) $('#goOn').focus({ preventScroll: true });
    save();
  } else {
    attempts[key]++;
    sfb.innerHTML = '<div class="fb bad"><p>Noch nicht alles richtig. Die Rückmeldungen zeigen, wo es hakt.</p></div>';
    if (attempts[key] >= 2) $('#solBtn').hidden = false;
  }
}
function endeHTML() {
  const rows = STATIONS.slice(1, -1).map(s => { const d = st.done[s.id]; return `<tr><td>${s.title}</td><td>${d ? (d.solved ? 'mit Lösung' : '✓ selbst gelöst') : 'offen'}</td></tr>`; }).join('');
  return `<p class="lead">Stark gemacht! Zeigt diese Karte eurer Lehrkraft.</p><div class="resultcard"><p class="badge-top">Ergebnis</p><p class="badge-name">${esc(st.team || 'Unser Team')}</p>
    <table class="rt"><thead><tr><th>Station</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table><p><b>Tipps genutzt:</b> ${st.tips || 0}</p>
    <p class="next">Gleich kommt das Kahoot – mit genau diesen Inhalten.</p></div>`;
}

/* ---------- Spickzettel ---------- */
function cheatHTML() {
  const rows = TASKS.input.klassen;
  return `<h3>Stoffklassen</h3><div class="tablewrap"><table class="ct"><thead><tr><th>Stoffklasse</th><th>Beispiel</th><th>Merkmal</th><th>Endung</th></tr></thead><tbody>${rows.map(([k, c, g, e]) => `<tr><td><b>${c}</b><br><span class="small">${nameOf(k)}</span></td><td class="cfig">${mol(k, { pad: 8 })}</td><td>${g}</td><td class="suffix">${e}</td></tr>`).join('')}</tbody></table></div>
    <h3>Stammnamen</h3><p>1 Meth · 2 Eth · 3 Prop · 4 But · 5 Pent · 6 Hex · 7 Hept · 8 Oct</p>
    <h3>Benennen</h3><ol class="list"><li>Stoffklasse → Endung</li><li>Längste Kette zählen (auch um die Ecke) → Stamm</li><li>Seitenketten: Methyl (1 C), Ethyl (2 C); gleiche zusammenfassen: di, tri; verschiedene alphabetisch</li><li>So nummerieren, dass funktionelle Gruppe bzw. Mehrfachbindung und dann die Seitenketten die kleinsten Zahlen bekommen</li><li>Schreibweise: 2,3-Dimethylbutan · Butan-2-ol · 3-Methylbut-1-en</li></ol>
    <h3>Vollständige Strukturformel</h3><p>C bildet 4 Bindungen, H bildet 1 Bindung, O bildet 2 Bindungen und hat 2 freie Elektronenpaare.</p>
    <h3>Isomere</h3><p>Gleiche Summenformel, andere Struktur. Gleicher Name heißt: dasselbe Molekül.</p>
    <h3>Alkohole</h3><p>Das C-Atom mit der OH-Gruppe hat 1 / 2 / 3 C-Nachbarn → primär / sekundär / tertiär.</p>`;
}
document.addEventListener('DOMContentLoaded', () => {
  $('#cheatBtn').onclick = () => { $('#cheatBody').innerHTML = cheatHTML(); $('#cheat').hidden = false; $('#cheatClose').focus(); };
  $('#cheatClose').onclick = () => { $('#cheat').hidden = true; $('#cheatBtn').focus(); };
  $('#cheat').addEventListener('click', e => { if (e.target.id === 'cheat') $('#cheat').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#cheat').hidden = true; });
  $('#navToggle').onclick = () => document.body.classList.toggle('navopen');
  $('#resetBtn').onclick = () => { $('#resetConfirm').hidden = false; };
  $('#resetNo').onclick = () => { $('#resetConfirm').hidden = true; };
  $('#resetYes').onclick = () => { st = fresh(); save(); $('#resetConfirm').hidden = true; stepIdx = 0; renderStation(); };
  $('#teachBtn').onclick = () => { $('#teachBox').hidden = !$('#teachBox').hidden; if (!$('#teachBox').hidden) $('#teachCode').focus(); };
  $('#teachBox').addEventListener('submit', e => {
    e.preventDefault();
    if ($('#teachCode').value.trim() === CODE) { st.unlock = true; save(); $('#teachCode').value = ''; renderStation(); $('#teachMsg').textContent = 'Alle Stationen sind freigeschaltet. „Lösung ansehen“ ist überall sichtbar.'; }
    else $('#teachMsg').textContent = 'Falscher Code.';
  });
  if (st.cur > maxReachable()) st.cur = maxReachable();
  const s = STATIONS[st.cur]; stepIdx = s.steps.length ? Math.min(st.at[s.id] !== undefined ? st.at[s.id] : firstOpen(s), maxStep(s)) : 0;
  renderStation();
});

</script>

</body>
