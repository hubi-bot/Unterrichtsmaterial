<script>
/* ===== Chemie-Kern: Molekülmodell, Benennung, Generator ===== */

function adjOf(mol) {

    return mol.atoms[x].el + '(' + ch.join(',') + ')';

function cmpArr(a, b) {

    if (Array.isArray(x)) { const c = cmpArr(x, y); if (c) return c; continue; }

}

/* ---- Benennung ---- */

  const CA = {}; C.forEach(c => CA[c] = A[c].filter(e => isC(e.to)).map(e => e.to));

}

function assemble(c, g, mb) {

    else if (cls === 'saeure') s = p + stem + 'ansäure';

    name, accepted: [...acc], cls, n, stem, chain: c.path, subs: c.subs.map(s => ({ name: s.name, loc: s.loc })),

function nameEster(mol, A, g) {

    name, alt: iupac, accepted: [name, iupac], cls: 'ester', n: acid.length, m: alk.length, stem: aStem,

/* ---- Antwortprüfung ---- */

  'acetaldehyd': 'Ethanal', 'formaldehyd': 'Methanal', 'ethylen': 'Ethen', 'acetylen': 'Ethin',
  'ethylacetat': 'Ethansäureethylester', 'essigsäureethylester': 'Ethansäureethylester', 'isopropanol': 'Propan-2-ol',
  'buttersäure': 'Butansäure', 'propionsäure': 'Propansäure', 'methylalkohol': 'Methanol', 'ethylalkohol': 'Ethanol',
  'essigester': 'Ethansäureethylester', 'isobutan': '2-Methylpropan'

function norm(s) {

const ENDING = { alkan: 'an', alken: 'en', alkin: 'in', alkohol: 'ol', aldehyd: 'al', keton: 'on', saeure: 'säure', ester: '' };
function checkName(input, info) {

function checkDrawing(mol, target) {
  if (!mol.atoms.length) return { status: 'invalid', msg: 'Das Zeichenfeld ist noch leer.' };
  const vp = valenceProblems(mol);
  if (vp.length) return { status: 'invalid', msg: 'Ein Atom hat zu viele Bindungen (C höchstens 4, O höchstens 2). Es ist rot markiert.', bad: vp };
  if (mol.bonds.length >= mol.atoms.length) return { status: 'invalid', msg: 'Deine Zeichnung enthält einen Ring. In diesem Trainer kommen nur Ketten vor.' };
  if (!isTree(mol)) return { status: 'invalid', msg: 'Nicht alle Atome sind miteinander verbunden.' };

/* ---- Aufbau aus einer Beschreibung (Spec) ---- */

    const a = mol.atoms[b.a], c = mol.atoms[b.b];
    const x1 = a.x * G, y1 = a.y * G, x2 = c.x * G, y2 = c.y * G;
    if (b.o === 1) s += line(x1, y1, x2, y2, R(a.el), R(c.el));
    else {
      const L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
      (b.o === 2 ? [-3.2, 3.2] : [-5, 0, 5]).forEach(o => { s += line(x1 + nx * o, y1 + ny * o, x2 + nx * o, y2 + ny * o, R(a.el), R(c.el)); });
    }
  });
  hpos.forEach(([hx, hy, hh]) => { const a = mol.atoms[hh.atom]; s += line(a.x * G, a.y * G, hx, hy, R(a.el), 6.5, 'bd bh'); });
  LP.forEach(l => {
    const a = mol.atoms[l.atom]; const cx = a.x * G + l.dx * G * 0.25, cy = a.y * G + l.dy * G * 0.25, px = -l.dy * G * 0.1, py = l.dx * G * 0.1;
    s += `<line class="lp" x1="${(cx - px).toFixed(1)}" y1="${(cy - py).toFixed(1)}" x2="${(cx + px).toFixed(1)}" y2="${(cy + py).toFixed(1)}"/>`;
  });
  mol.atoms.forEach(a => { if (a.el !== '*') s += `<text class="at at-${a.el}" x="${a.x * G}" y="${a.y * G}">${a.el}</text>`; });
  hpos.forEach(([hx, hy]) => { s += `<text class="at at-H" x="${hx.toFixed(1)}" y="${hy.toFixed(1)}">H</text>`; });
  (opts.numbers || []).forEach((ai, i) => { const a = mol.atoms[ai]; s += `<text class="num" x="${a.x * G + 16}" y="${a.y * G - 16}">${i + 1}</text>`; });
  const scale = opts.scale || 1;
  return `<svg class="mol" viewBox="${minX.toFixed(1)} ${minY.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" width="${(w * scale).toFixed(0)}" role="img" aria-label="${esc(opts.label || 'Strukturformel')}">${s}</svg>`;
}

// Kugelmodell: C mit vier verschiedenen Partnern, gespiegelt
function ballModel(mirror) {
  const sx = mirror ? -1 : 1;
  const bonds = [[0, -70, '#F2F2EE', 'weiß'], [-62 * sx, 38, '#C4352B', 'rot'], [62 * sx, 38, '#2E8B57', 'grün'], [18 * sx, 22, '#E2B007', 'gelb']];
  let s = '';
  bonds.forEach(([x, y]) => { s += `<line x1="0" y1="0" x2="${x}" y2="${y}" class="stick"/>`; });
  bonds.slice(0, 3).forEach(([x, y, c]) => { s += `<circle cx="${x}" cy="${y}" r="22" fill="${c}" class="ball"/>`; });
  s += `<circle cx="0" cy="0" r="26" fill="#22272E" class="ball"/>`;
  const [x, y, c] = bonds[3]; s += `<circle cx="${x * 1.9}" cy="${y * 1.9}" r="17" fill="${c}" class="ball front"/><line x1="0" y1="0" x2="${x * 1.9}" y2="${y * 1.9}" class="stick"/>`;
  return `<svg class="balls" viewBox="-110 -110 220 200" role="img" aria-label="Kugelmodell: schwarzes C-Atom mit vier verschiedenfarbigen Kugeln${mirror ? ', Spiegelbild' : ''}">${s}</svg>`;
}

      { input: true, intro: inputZeichnen,
        tasks: [{ type: 'num', q: 'Kurzcheck: Wie viele H-Atome hat Propan (3 C-Atome, nur Einfachbindungen)? Zeichnet es, wenn ihr unsicher seid.', a: 8, tips: ['Die beiden äußeren C-Atome haben je 1 Bindung zum Nachbar-C, also 3 H-Atome. Das mittlere C-Atom hat 2 Nachbarn, also 2 H-Atome.'], fb: () => `<p>3 + 2 + 3 = 8 H-Atome.</p><div class="paper inline">${mol('propan')}</div>` }] },
      ...TASKS.zeichnen.map(([k, h, lp], i) => ({
        intro: () => i === 0 ? `<p class="lead">Ihr bekommt einen Namen und zeichnet die vollständige Strukturformel auf Papier. Zur Kontrolle zählt ihr H-Atome und freie Elektronenpaare. Danach seht ihr die Lösung und vergleicht.</p>` : '',
        tasks: [{ type: 'draw', key: k, h, lp,
          tips: ['Zeichnet erst die Kette der C-Atome. Jedes C-Atom braucht genau 4 Bindungsstriche – füllt mit H-Atomen auf.', 'Jedes O-Atom hat 2 Bindungen und 2 freie Elektronenpaare. Eine Doppelbindung zählt als 2 Bindungen.'],
          fb: () => `<p>So sieht die vollständige Strukturformel aus. Vergleicht Atom für Atom:</p><div class="paper">${mol(k)}</div>` }] }))] },

  { id: 'isomere', title: 'Isomere', kind: 'Input + Digital', min: 7,
    steps: [
      { input: true, intro: inputIsomere,
        tasks: [{ type: 'sel', q: 'Was trifft auf das Paar zu?', cols: [{ name: 'Beziehung', opts: REL }],
          rows: TASKS.paare.map(([a, b, r], i) => ({ html: `<div class="pair"><div class="paper sm">${mol(a)}</div><div class="paper sm">${mol(b)}</div></div>`, label: `Paar ${i + 1}`, a: [REL[r]] })),
          tips: ['Zählt in beiden Molekülen C-, H- und O-Atome. Unterschiedliche Anzahl → andere Summenformel.', 'Gleiche Anzahl: Gebt beiden Molekülen in Gedanken einen Namen. Gleicher Name → dasselbe Molekül, anderer Name → Isomere.'],
          fb: () => '<ul class="corr">' + TASKS.paare.map(([a, b, r, why], i) => `<li><b>Paar ${i + 1}: ${REL[r]}.</b> ${why}</li>`).join('') + '</ul>' }] },
      { intro: () => '',
        tasks: [{ type: 'pick', q: 'Welche dieser Moleküle sind Isomere mit der Summenformel C₅H₁₂? Wählt alle passenden aus.', show: TASKS.c5h12.show, correct: TASKS.c5h12.correct,
          tips: ['Zählt in jedem Molekül die C-Atome: Es müssen genau 5 sein.'],
          fb: () => `<p>Richtig sind Pentan, 2-Methylbutan und 2,2-Dimethylpropan – die drei Isomere von C₅H₁₂. Butan hat nur 4 C-Atome, 2-Methylpentan hat 6.</p>` }] }] },

  { id: 'nachbauen', title: 'Nachbauen', kind: 'Baukasten', min: 7,
    steps: [
      { input: true, intro: () => `${inputBau()}${card('Baut nach', `<p>Baut dieses Molekül mit dem Molekülbaukasten:</p><div class="paper inline">${mol('propan1ol')}</div><p>Setzt dann die OH-Gruppe an das <b>mittlere</b> C-Atom um.</p>`, 'kitcard')}`,
        tasks: [
          { type: 'mc', q: 'Wie heißt das Molekül, mit dem ihr gestartet seid?', o: ['Propan-1-ol', 'Propan-2-ol', 'Propanal', 'Propanon'], a: 0 },
          { type: 'mc', q: 'Und wie heißt es, nachdem ihr die OH-Gruppe umgesetzt habt?', o: ['Propan-1-ol', 'Propan-2-ol', 'Propanal', 'Propanon'], a: 1, tips: ['Die Zahl vor -ol gibt an, an welchem C-Atom die OH-Gruppe sitzt.'] },
          { type: 'mc', q: 'Die beiden Moleküle sind …', o: ['Isomere', 'dasselbe Molekül', 'verschiedene Stoffklassen'], a: 0, fb: 'Isomere: gleiche Summenformel C₃H₈O, andere Struktur.' }] },
      { intro: () => `${card('Baut alle Alkohole mit vier C-Atomen', '<p>Baut alle Alkohole mit der Summenformel C₄H₁₀O: Es gibt zwei Kohlenstoffgerüste (gerade Kette und verzweigte Kette). Setzt die OH-Gruppe an alle Stellen, die zu verschiedenen Molekülen führen.</p>', 'kitcard')}`,
        tasks: [{ type: 'pick', q: 'Welche dieser Strukturformeln habt ihr gebaut? Wählt alle Alkohole mit der Summenformel C₄H₁₀O aus.', show: TASKS.alkohole.show, correct: TASKS.alkohole.correct,
          tips: ['Ein Alkohol hat eine OH-Gruppe. Zählt außerdem die C-Atome: genau 4.'],
          fb: 'Vier Alkohole: Butan-1-ol, Butan-2-ol, 2-Methylpropan-1-ol und 2-Methylpropan-2-ol. Butanal ist ein Aldehyd, Propan-1-ol hat nur 3 C-Atome.' }] },
      { intro: () => `${card('Zum Schluss: Bild und Spiegelbild', `<p>Baut ein schwarzes C-Atom mit <b>vier verschiedenfarbigen</b> Kugeln und daneben sein Spiegelbild. Versucht, beide durch Drehen zur Deckung zu bringen – wie bei Contergan und Carvon aus der Präsentation.</p><div class="mirror">${ballModel(false)}<span class="mline" aria-hidden="true"></span>${ballModel(true)}</div>`, 'kitcard')}`,
        tasks: [{ type: 'mc', q: 'Gelingt es?', o: ['Ja', 'Nein, egal wie wir drehen'], a: 1, fb: 'Nein: Bild und Spiegelbild sind nicht deckungsgleich – wie eure linke und rechte Hand.' }] }] },

  { id: 'ende', title: 'Geschafft', kind: 'Info', min: 0, steps: [] },
];

/* ---------- Speicher ---------- */
const KEY = 'rein-in-die-oc.v2';
let st = { team: '', done: {}, cur: 0, tips: 0 };
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && typeof x === 'object') st = Object.assign(st, x); } catch (e) { }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } };

/* ---------- Ablauf ---------- */
let stepIdx = 0, attempts = {}, tipIdx = {};
function maxReachable() { let i = 0; while (i < STATIONS.length - 1 && st.done[STATIONS[i].id]) i++; return i; }
function renderNav() {
  const total = STATIONS.length - 2, done = STATIONS.slice(1, -1).filter(s => st.done[s.id]).length;
  $('#progressBar').style.width = (done / total * 100) + '%';
  $('#progressTxt').textContent = done + ' von ' + total + ' Stationen';
  $('#nav').innerHTML = STATIONS.map((s, i) => {
    const state = st.done[s.id] ? 'done' : (i <= maxReachable() ? 'open' : 'locked');
    return `<li><button class="nav-it ${state}${i === st.cur ? ' cur' : ''}" data-go="${i}" ${state === 'locked' ? 'disabled' : ''}><span class="nav-no">${state === 'done' ? '✓' : (i === 0 ? '•' : s.id === 'ende' ? '★' : i)}</span><span class="nav-t">${s.title}</span>${s.kind === 'Baukasten' ? '<span class="nav-code">Bau</span>' : ''}</button></li>`;
  }).join('');
  $('#cheatBtn').hidden = !st.done.start;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b || b.disabled) return;
  st.cur = +b.dataset.go; stepIdx = 0; save(); renderStation(); document.body.classList.remove('navopen');
});
function renderStation() {
  renderNav();
  const i = st.cur, s = STATIONS[i], box = $('#main');
  const head = `<header class="st-head"><p class="eyebrow">${s.id === 'ende' ? 'Ende' : `Station ${i} von ${STATIONS.length - 2}`} · <span class="kind ${s.kind === 'Baukasten' ? 'kit' : ''}">${s.kind}</span>${s.min ? ` · ca. ${s.min} Min.` : ''}</p><h2>${s.title}</h2></header>`;
  if (s.id === 'start') box.innerHTML = '';
  if (s.id === 'ende') { box.innerHTML = head + endeHTML(); return; }
  if (st.done[s.id]) {
    box.innerHTML = head + `<div class="fb good"><p class="fb-h">Station erledigt</p><div class="row"><button class="btn ghost" id="redo">Station wiederholen</button><button class="btn primary" id="next">Weiter</button></div></div>`;
    $('#redo').onclick = () => { delete st.done[s.id]; stepIdx = 0; save(); renderStation(); };
    $('#next').onclick = () => { st.cur = Math.min(i + 1, STATIONS.length - 1); stepIdx = 0; save(); renderStation(); window.scrollTo(0, 0); };
    return;
  }
  const step = s.steps[stepIdx];
  const dots = s.steps.length > 1 ? `<p class="steps">Teil ${stepIdx + 1} von ${s.steps.length}${step.input ? ' · <span class="inp">Input</span>' : ''}</p>` : '';
  box.innerHTML = (s.id === 'start' ? head.replace(`Station 0 von ${STATIONS.length - 2}`, 'Willkommen') : head) + dots + `<div class="step">${step.intro()}<form id="stepForm" class="tasks" autocomplete="off">${step.tasks.map((t, k) => `<div class="task-wrap" data-k="${k}">${T[t.type].render(t, `t${k}`)}<div class="tips" id="tips${k}"></div><div class="tfb" id="fb${k}"></div></div>`).join('')}
    <div class="row actions"><button class="btn primary" type="submit" id="check">${step.tasks[0].type === 'memory' ? 'Fertig' : 'Prüfen'}</button>${step.tasks.some(t => t.tips) ? '<button class="btn ghost" type="button" id="tipBtn">Tipp</button>' : ''}<button class="btn ghost" type="button" id="solBtn" hidden>Lösung ansehen</button></div>
    <div id="stepFb" aria-live="polite"></div></form></div>`;
  if (step.tasks[0].key === 'team') $('#t0-in').value = st.team || '';
  const key = s.id + ':' + stepIdx; attempts[key] = attempts[key] || 0; tipIdx[key] = 0;
  $('#stepForm').addEventListener('submit', ev => { ev.preventDefault(); check(false); });
  const tb = $('#tipBtn'); if (tb) tb.onclick = showTip;
  $('#solBtn').onclick = () => check(true);
}
function showTip() {
  const s = STATIONS[st.cur], step = s.steps[stepIdx], key = s.id + ':' + stepIdx;
  const all = []; step.tasks.forEach((t, k) => (t.tips || []).forEach(tp => all.push([k, tp])));
  // Bei mehreren Aufgaben: zuerst Tipps zu den noch falschen Aufgaben
  const n = Math.min(++tipIdx[key], all.length);
  step.tasks.forEach((t, k) => { const mine = all.slice(0, n).filter(x => x[0] === k).map(x => x[1]); $(`#tips${k}`).innerHTML = mine.length ? `<div class="tip"><p class="tip-h">Tipp</p><ul>${mine.map(m => `<li>${m}</li>`).join('')}</ul></div>` : ''; });
  st.tips = (st.tips || 0) + 1; save();
  if (n >= all.length) $('#tipBtn').disabled = true;
}
function check(reveal) {
  const s = STATIONS[st.cur], step = s.steps[stepIdx], key = s.id + ':' + stepIdx;
  if (!step) return;
  let allOk = true, missing = false;
  step.tasks.forEach((t, k) => {
    const id = `t${k}`, tt = T[t.type];
    if (reveal) {
      if (tt.fill) tt.fill(t, id);
      if (t.type === 'mc') document.querySelectorAll(`input[name="${id}"]`).forEach(x => { x.checked = +x.value === t.a; });
      if (t.type === 'num') $(`#${id}-in`).value = t.a;
    }
    const v = tt.read(id, t);
    if (t.key === 'team') st.team = (v || '').trim();
    const empty = t.type !== 'memory' && t.type !== 'pick' && t.type !== 'text' && (v === null || (Array.isArray(v) && v.some(x => x === null || x === '' || (Array.isArray(x) && x.some(y => y === '')))));
    const ok = !empty && tt.ok(t, v);
    if (empty && !reveal) missing = true;
    if (!ok) allOk = false;
    if (t.type === 'sel') t.rows.forEach((r, i) => { const m = document.querySelector(`#${id} .row-sel[data-i="${i}"] .mark`); const rk = tt.rowOk(t, v, i); m.textContent = rk ? '✓' : '✗'; m.className = 'mark ' + (rk ? 'ok' : 'bad'); });
    const fb = $(`#fb${k}`);
    if (ok || reveal) {
      const f = typeof t.fb === 'function' ? t.fb() : (t.fb || '');
      const extra = t.type === 'name' ? `<p>${reveal && !ok ? 'Lösung' : 'Richtig'}: <b>${nameOf(t.key)}</b></p>` : '';
      fb.innerHTML = (f || extra) ? `<div class="fb good">${extra}${f ? (f.startsWith('<') ? f : `<p>${f}</p>`) : ''}</div>` : '';
    } else if (!empty) {
      let msg = 'Das stimmt noch nicht.';
      if (t.type === 'name') { const r = checkName(v, M(t.key).info); if (r.status === 'hint') msg = r.msg.replace(/^Regel \d+: /, ''); else if (r.diag) msg += ' ' + r.diag.replace(/^Regel \d+: /, ''); }
      if (t.type === 'draw') msg = `Eure Zählung stimmt noch nicht. ${v[0] !== t.h ? 'Prüft die H-Atome: Jedes C-Atom braucht genau 4 Bindungen.' : ''} ${v[1] !== t.lp ? 'Prüft die freien Elektronenpaare: Jedes O-Atom hat zwei.' : ''}`;
      if (t.type === 'memory') msg = 'Es fehlen noch Paare.';
      fb.innerHTML = `<div class="fb ${t.type === 'name' && checkName(v, M(t.key).info).status === 'hint' ? 'note' : 'bad'}"><p>${msg}</p></div>`;
    } else fb.innerHTML = '';
  });
  const sfb = $('#stepFb');
  if (missing && !allOk) { sfb.innerHTML = '<div class="fb note"><p>Beantwortet zuerst alle Fragen.</p></div>'; return; }
  if (allOk || reveal) {
    if (reveal) { st.solved = st.solved || {}; st.solved[s.id] = true; }
    document.querySelectorAll('#stepForm input, #stepForm select, #stepForm .mini').forEach(x => { if (step.tasks[0].key !== 'team') x.disabled = true; });
    $('#check').hidden = true; const tb = $('#tipBtn'); if (tb) tb.hidden = true; $('#solBtn').hidden = true;
    const last = stepIdx + 1 >= s.steps.length;
    sfb.innerHTML = `<div class="row actions"><button class="btn primary" type="button" id="goOn">${last ? (st.cur + 1 < STATIONS.length - 1 ? 'Weiter zur nächsten Station' : 'Fertig') : 'Weiter zu Teil ' + (stepIdx + 2)}</button></div>`;
    $('#goOn').onclick = () => {
      if (last) { st.done[s.id] = { solved: !!(st.solved && st.solved[s.id]) }; stepIdx = 0; st.cur = Math.min(st.cur + 1, STATIONS.length - 1); save(); renderStation(); }
      else { stepIdx++; renderStation(); }
      window.scrollTo(0, 0);
    };
    $('#goOn').focus({ preventScroll: true });
    save();
  } else {
    attempts[key]++;
    sfb.innerHTML = '<div class="fb bad"><p>Noch nicht alles richtig. Die Rückmeldungen zeigen, wo es hakt.</p></div>';
    if (attempts[key] >= 2) $('#solBtn').hidden = false;
  }
}
function endeHTML() {
  const rows = STATIONS.slice(1, -1).map(s => { const d = st.done[s.id]; return `<tr><td>${s.title}</td><td>${d ? (d.solved ? 'mit Lösung' : '✓ selbst gelöst') : 'offen'}</td></tr>`; }).join('');
  return `<p class="lead">Stark gemacht! Zeigt diese Karte eurer Lehrkraft.</p><div class="resultcard"><p class="badge-top">Ergebnis</p><p class="badge-name">${esc(st.team || 'Unser Team')}</p>
    <table class="rt"><thead><tr><th>Station</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table><p><b>Tipps genutzt:</b> ${st.tips || 0}</p>
    <p class="next">Gleich kommt das Kahoot – mit genau diesen Inhalten.</p></div>`;
}

/* ---------- Spickzettel ---------- */
function cheatHTML() {
  const rows = [['ethan', 'Alkane', 'nur Einfachbindungen', '-an'], ['ethen', 'Alkene', 'C=C-Doppelbindung', '-en'], ['ethin', 'Alkine', 'C≡C-Dreifachbindung', '-in'], ['ethanol', 'Alkohole', 'Hydroxygruppe (O–H)', '-ol'],
    ['ethanal', 'Aldehyde', 'C=O am Kettenende mit H', '-al'], ['propanon', 'Ketone', 'C=O in der Kette', '-on'], ['ethansaeure', 'Carbonsäuren', 'Carboxygruppe (C=O und O–H)', '-säure']];
  return `<h3>Stoffklassen</h3><div class="tablewrap"><table class="ct"><thead><tr><th>Stoffklasse</th><th>Beispiel</th><th>Merkmal</th><th>Endung</th></tr></thead><tbody>${rows.map(([k, c, g, e]) => `<tr><td><b>${c}</b><br><span class="small">${nameOf(k)}</span></td><td class="cfig">${mol(k, { pad: 8 })}</td><td>${g}</td><td class="suffix">${e}</td></tr>`).join('')}</tbody></table></div>
    <h3>Stammnamen</h3><p>1 Meth · 2 Eth · 3 Prop · 4 But · 5 Pent · 6 Hex · 7 Hept · 8 Oct</p>
    <h3>Benennen</h3><ol class="list"><li>Stoffklasse → Endung</li><li>Längste Kette zählen → Stamm</li><li>Seitenketten: Methyl (1 C), Ethyl (2 C); gleiche zusammenfassen: Dimethyl</li><li>So nummerieren, dass funktionelle Gruppe bzw. Mehrfachbindung und dann die Seitenketten die kleinsten Zahlen bekommen</li><li>Schreibweise: 2,3-Dimethylbutan · Butan-2-ol · But-1-en</li></ol>
    <h3>Vollständige Strukturformel</h3><p>C bildet 4 Bindungen, H bildet 1 Bindung, O bildet 2 Bindungen und hat 2 freie Elektronenpaare.</p>
    <h3>Isomere</h3><p>Gleiche Summenformel, andere Struktur. Gleicher Name heißt: dasselbe Molekül.</p>`;
}
document.addEventListener('DOMContentLoaded', () => {
  $('#cheatBtn').onclick = () => { $('#cheatBody').innerHTML = cheatHTML(); $('#cheat').hidden = false; $('#cheatClose').focus(); };
  $('#cheatClose').onclick = () => { $('#cheat').hidden = true; $('#cheatBtn').focus(); };
  $('#cheat').addEventListener('click', e => { if (e.target.id === 'cheat') $('#cheat').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#cheat').hidden = true; });
  $('#navToggle').onclick = () => document.body.classList.toggle('navopen');
  $('#resetBtn').onclick = () => { $('#resetConfirm').hidden = false; };
  $('#resetNo').onclick = () => { $('#resetConfirm').hidden = true; };
  $('#resetYes').onclick = () => { st = { team: '', done: {}, cur: 0, tips: 0 }; save(); $('#resetConfirm').hidden = true; stepIdx = 0; renderStation(); };
  if (st.cur > maxReachable()) st.cur = maxReachable();
  renderStation();
});

</script>

</body></html>
