// ---------------------------------------------------------- Musterlösung
function solutionLines(t){
  const L_=[];
  if(t.type==='calc'){
    L.calcLines(t).forEach((ln,i)=>{
      const e=ln.e,p=ln.prev; let expl='',vis='';
      if(ln.step==='start') expl=`So sieht die Aufgabe aus. Wir rechnen Schritt für Schritt untereinander – jede Zeile beginnt mit „=“.`;
      if(ln.step==='gleich'){const D=e.a.d;expl=`Die Nenner ${p.a.d} und ${p.b.d} sind verschieden. Wir brauchen einen gemeinsamen Nenner: Der Hauptnenner ist ${D}. `+
        [['a','erste'],['b','zweite']].map(([k,nm])=>p[k].d===D?`Die ${nm} Zahl hat schon den Nenner ${D}.`:`${p[k].n}/${p[k].d} erweitern mit ${D/p[k].d}: ${p[k].n}·${D/p[k].d} = ${e[k].n}, ${p[k].d}·${D/p[k].d} = ${D}.`).join(' ')+' Die Ganzen bleiben gleich.';
        vis=['a','b'].filter(k=>p[k].n).map(k=>`<div style="display:flex;align-items:center;gap:10px;margin:4px 0;font-family:var(--f-hand);font-size:22px"><span style="width:60px">${F({w:0,n:p[k].n,d:p[k].d})}</span>${barSVG(p[k].d,p[k].n,{w:300})}<span>=</span>${barSVG(D,e[k].n,{w:300})}</div>`).join('');}
      if(ln.step==='entb'){const D=e.a.d;expl=(p.a.n?`${p.a.n}/${D} ist kleiner als ${p.b.n}/${D}. Davon kann man ${p.b.n}/${D} nicht abziehen! `:`Die erste Zahl hat keinen Bruchteil, von dem man ${p.b.n}/${D} abziehen kann. `)+`Darum tauschen wir ein Ganzes in ${D}tel um: 1 = ${D}/${D}. Aus ${p.a.w} Ganzen werden ${p.a.w-1}, und der Bruch wird ${p.a.n}/${D} + ${D}/${D} = ${e.a.n}/${D}.`;
        vis=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-hand);font-size:22px"><span>1 Ganzes =</span>${barSVG(D,D,{w:260})}<span>+</span>${barSVG(D,p.a.n,{w:260,color:'var(--pen)'})}<span>= ${F({w:0,n:e.a.n,d:D})}</span></div>`;}
      if(ln.step==='rech'){const D=p.a.d;expl=`Jetzt rechnen: Ganze ${OP(t.op)} Ganze: ${p.a.w} ${OP(t.op)} ${p.b.w} = ${e.r.w}. Zähler ${OP(t.op)} Zähler: ${p.a.n} ${OP(t.op)} ${p.b.n} = ${e.r.n}. Der Nenner ${D} bleibt gleich!`;}
      if(ln.step==='buend'){const D=p.r.d,k=Math.floor(p.r.n/D);expl=`${p.r.n}/${D} ist ${k>1?'mehr als '+k+' Ganze':'ein Ganzes oder mehr'}: ${D}/${D} = 1. Wir bündeln: ${p.r.w} + ${k} = ${e.r.w} Ganze${e.r.n?`, übrig bleiben ${e.r.n}/${D}`:''}.`;
        vis=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${barSVG(D,D,{w:240})}${k>1?'<span style="font-family:var(--f-hand);font-size:22px">…</span>':''}${e.r.n?`<span style="font-family:var(--f-hand);font-size:22px">+</span>${barSVG(D,e.r.n,{w:240,color:'var(--pen)'})}`:''}</div>`;}
      if(ln.step==='kuerz'){const g=p.r.n/e.r.n;expl=`${p.r.n} und ${p.r.d} sind beide durch ${g} teilbar. Kürzen: ${p.r.n} : ${g} = ${e.r.n} und ${p.r.d} : ${g} = ${e.r.d}. Die Ganzen bleiben.`;}
      L_.push({html:(i?'<span>=</span>':'')+lineHTML(e,t.op),expl,vis});
    });
    L_[L_.length-1].expl+=' Fertig – das ist das Ergebnis!';
  } else if(t.type==='zs'){
    const idx=L.zsIndex(t),v=L.val(t.t),num=v.n*t.k/v.d,rel=num-t.start*t.k;
    L_.push({html:`<span class="txt">${t.mode==='mark'?'Wo liegt':'Welche Zahl zeigt der Pfeil?'}</span> ${t.mode==='mark'?F(t.t)+'<span class="txt">?</span>':''}`,expl:'Schau dir zuerst die Einteilung an.',vis:nlSVG(t,t.mode==='read'?{arrow:idx}:{})});
    L_.push({html:`<span class="txt">1 Ganzes =</span> ${t.k} <span class="txt">Teile</span>`,expl:`Zähle die Abstände (nicht die Striche!) ${t.start?`von ${t.start} bis ${t.start+1}`:'von 0 bis 1'}: Es sind ${t.k} gleich große Teile. Jeder Teil ist also 1/${t.k}.`,vis:nlSVG({...t,start:t.start},{hlUnit:true,...(t.mode==='read'?{arrow:idx}:{})})});
    if(t.mode==='mark'){
      if(!(t.t.w===0&&t.t.d===t.k)) L_.push({html:`${F(t.t)}<span>=</span>${F({w:0,n:num,d:t.k})}`,expl:`Der Zahlenstrahl ist in ${t.k}tel eingeteilt. `+convExpl(t.t,t.k),vis:''});
      L_.push({html:`<span class="txt">Von ${t.start} aus</span> ${rel} <span class="txt">Teile nach rechts</span>`,expl:t.start?`Der Zahlenstrahl beginnt bei ${t.start}. ${t.start} sind ${t.start*t.k}/${t.k}. Also zählen wir von ${t.start} aus noch ${rel} Teile nach rechts.`:`Zähle von 0 aus ${num} Sprünge nach rechts. Dort machst du den Strich.`,vis:nlSVG(t,{hlTo:rel,ok:idx,okLabel:t.t})});
    } else {
      L_.push({html:`<span class="txt">bis zum Pfeil:</span> ${F({w:0,n:num,d:t.k})}`,expl:t.start?`Von ${t.start} bis zum Pfeil sind es ${rel} Teile. ${t.start} = ${t.start*t.k}/${t.k}, also zeigt der Pfeil auf ${t.start*t.k}/${t.k} + ${rel}/${t.k} = ${num}/${t.k}.`:`Zähle von 0 bis zum Pfeil: ${num} Teile. Der Pfeil zeigt also auf ${num}/${t.k}.`,vis:nlSVG(t,{hlTo:rel,arrow:idx})});
      const sm=L.toMixed(v);
      if(!(sm.w===0&&sm.d===t.k)) L_.push({html:`<span>=</span>${F(sm)}`,expl:'So einfach wie möglich: '+[num>=t.k?'bündeln (wie viele Ganze stecken drin?)':'',L.gcd(num,t.k)>1?`kürzen mit ${L.gcd(num,t.k)}`:''].filter(Boolean).join(' und ')+`. Ergebnis: ${L.txt(sm)}.`,vis:''});
    }
  } else if(t.type==='zsm'){
    const Z={ticks:t.items.map(m=>{const v=L.val(m);return v.n*t.k/v.d;})};
    L_.push({html:t.items.map(F).join('<span>;</span>'),expl:'Diese Zahlen sollen auf den Zahlenstrahl. Sie haben verschiedene Nenner – wir bringen sie alle auf die Einteilung des Zahlenstrahls.',vis:nlSVG(t,{})});
    L_.push({html:`<span class="txt">1 Ganzes =</span> ${t.k} <span class="txt">Teile</span>`,expl:`Zähle die Abstände (nicht die Striche!) von 0 bis 1: Es sind ${t.k} gleich große Teile. Jeder Teil ist also 1/${t.k}.`,vis:nlSVG(t,{hlUnit:true})});
    t.items.forEach((m,i)=>{const num=Z.ticks[i];
      L_.push({html:(m.w===0&&m.d===t.k)?`${F(m)} <span class="txt">passt schon</span>`:`${F(m)}<span>=</span>${F({w:0,n:num,d:t.k})}`,expl:convExpl(m,t.k)+` Zähle von 0 aus ${num} Teile nach rechts.`,vis:nlSVG(t,{hlTo:num,ok:num,okLabel:m})});});
    const placed=t.items.map((m,i)=>({m,idx:Z.ticks[i]})).sort((a,b)=>a.idx-b.idx);
    L_.push({html:'<span class="txt">Alle Zahlen eingetragen</span>',expl:'Fertig! Alle Zahlen stehen an ihrem Strich. Zahlen, die gleich groß sind, würden am selben Strich stehen.',vis:nlSVG(t,{marks:placed.map((p,j)=>({idx:p.idx,label:p.m,up:j%2===0||p.idx%t.k===0,cls:'ok'}))})});
  } else if(t.type==='cmp'){
    const D=L.lcm(t.a.d,t.b.d),ca=L.val(t.a),cb=L.val(t.b),A={w:0,n:ca.n*D/ca.d,d:D},B={w:0,n:cb.n*D/cb.d,d:D};
    const c=L.rcmp(ca,cb),sym=c<0?'&lt;':c>0?'&gt;':'=';
    L_.push({html:`${F(t.a)} <span class="slot">?</span> ${F(t.b)}`,expl:'Brüche mit verschiedenen Nennern kann man schlecht vergleichen. Wir machen sie gleichnamig.',vis:''});
    L_.push({html:`${F(A)} <span class="slot">?</span> ${F(B)}`,expl:`Der Hauptnenner von ${t.a.d} und ${t.b.d} ist ${D}. ${L.txt(t.a)} = ${A.n}/${D} und ${L.txt(t.b)} = ${B.n}/${D}.${(t.a.w||t.b.w)?' Die Ganzen haben wir mit in den Zähler genommen.':''}`,
      vis:D<=36?`<div style="display:grid;gap:6px">${barSVG(D,Math.min(A.n,D),{w:420})}${A.n>D?barSVG(D,A.n-D,{w:420}):''}<hr style="border:0;border-top:1px dashed var(--muted);margin:2px 0">${barSVG(D,Math.min(B.n,D),{w:420,color:'var(--pen)'})}${B.n>D?barSVG(D,B.n-D,{w:420,color:'var(--pen)'}):''}</div>`:''});
    L_.push({html:`${F(t.a)} <span class="slot">${sym}</span> ${F(t.b)}`,expl:`Gleiche Nenner: Jetzt vergleichst du nur die Zähler: ${A.n} ${c<0?'<':c>0?'>':'='} ${B.n}. Darum gilt ${L.txt(t.a)} ${c<0?'<':c>0?'>':'='} ${L.txt(t.b)}.`,vis:''});
  } else {
    const D=t.items.map(m=>m.d).reduce(L.lcm),conv=t.items.map(m=>{const v=L.val(m);return {w:0,n:v.n*D/v.d,d:D};});
    const ord=t.items.map((_,i)=>i).sort((x,y)=>L.rcmp(L.val(t.items[x]),L.val(t.items[y])));
    L_.push({html:t.items.map(F).join('<span>;</span>'),expl:'Zum Ordnen machen wir alle Zahlen gleichnamig.',vis:''});
    L_.push({html:conv.map(F).join('<span>;</span>'),expl:`Der Hauptnenner ist ${D}. `+t.items.map((m,i)=>`${L.txt(m)} = ${conv[i].n}/${D}`).join(', ')+'.',vis:''});
    L_.push({html:ord.map(i=>F(conv[i])).join('<span>&lt;</span>'),expl:'Jetzt ordnen wir nach den Zählern – vom kleinsten zum größten.',vis:''});
    L_.push({html:ord.map(i=>F(t.items[i])).join('<span>&lt;</span>'),expl:'Zum Schluss schreiben wir wieder die ursprünglichen Zahlen hin. Fertig!',vis:''});
  }
  return L_;
}
function convExpl(m,k){ // Erklärung: Zahl m auf den Nenner k bringen
  const v=L.val(m),num=v.n*k/v.d;
  if(m.w===0&&m.d===k) return `${L.txt(m)} hat schon den Nenner ${k} – das passt.`;
  if(v.d===1) return `${L.txt(m)} = ${v.n}${m.w?'':` (denn ${m.n} : ${m.d} = ${v.n})`}. ${v.n} Ganze sind ${v.n}·${k}/${k} = ${num}/${k}. Der Strich ist also genau bei ${v.n}.`;
  if(k%m.d===0){const f=k/m.d;
    return (m.w?`Die ${m.w} Ganzen sind ${m.w*k}/${k}. `:'')+(f>1?`${m.n}/${m.d} erweitern mit ${f}: ${m.n}·${f} = ${m.n*f}, ${m.d}·${f} = ${k}, also ${m.n*f}/${k}.`:`${m.n}/${m.d} hat schon den Nenner ${k}.`)+(m.w?` Zusammen: ${num}/${k}.`:'');}
  const r=L.R(m.n,m.d),f=k/r.d;
  return `Der Nenner ${m.d} passt nicht in ${k}. Darum zuerst kürzen: ${m.n}/${m.d} = ${r.n}/${r.d}. Dann erweitern mit ${f}: ${r.n}/${r.d} = ${r.n*f}/${k}.`+(m.w?` Mit den ${m.w} Ganzen (${m.w*k}/${k}) zusammen: ${num}/${k}.`:'');
}
let ML={lines:[],i:0};
// ---------------------------------------------------------- Tipp (verrät die Lösung nicht)
function tipText(){
  const t=S.task,s=curStep(); if(!t||!s) return '';
  const opw=t.op==='+'?'plus':'minus';
  if(t.type==='calc'){const e=S.e;
    if(s==='gleich'){const x=Math.min(e.a.d,e.b.d),y=Math.max(e.a.d,e.b.d);
      return y%x===0?`Schau dir die Nenner ${x} und ${y} an: ${y} ist ein Vielfaches von ${x}. Erweitere den Bruch mit dem Nenner ${x} so, dass unten ${y} steht. Die Ganzen bleiben gleich.`
        :`Suche den Hauptnenner: Gehe die ${y}er-Reihe durch (${y}, ${2*y}, ${3*y}, …). Welche Zahl ist auch durch ${x} teilbar? Erweitere dann beide Brüche. Die Ganzen bleiben gleich.`;}
    if(s==='entb'){const D=e.a.d;
      return e.a.n?`${e.a.n}/${D} ist kleiner als ${e.b.n}/${D} – davon kannst du ${e.b.n}/${D} nicht abziehen. Nimm 1 Ganzes weg und lege es als ${D}tel zum Zähler dazu. Wie viele ${D}tel sind ein Ganzes?`
        :`${e.a.w} hat keinen Bruchteil. Nimm 1 Ganzes weg und schreibe es als Bruch mit dem Nenner ${D}. Wie viele ${D}tel sind ein Ganzes? Schau dir notfalls das Beispiel an.`;}
    if(s==='rech') return `Rechne in zwei Teilen: Ganze ${opw} Ganze und Zähler ${opw} Zähler. Der Nenner ${e.a.d} bleibt gleich!`;
    if(s==='buend') return `${e.r.n}/${e.r.d}: Wie oft passt ${e.r.d} in ${e.r.n}? So viele Ganze kommen zu den Ganzen dazu. Der Rest bleibt im Zähler.`;
    if(s==='kuerz') return `Suche eine Zahl, durch die ${e.r.n} und ${e.r.d} beide teilbar sind. Teile Zähler und Nenner durch diese Zahl. Die Ganzen bleiben.`;}
  if(t.type==='zs'||t.type==='zsm'){const k=t.k,st=t.start||0;
    if(s==='teile') return `Zähle die Abstände (Sprünge) zwischen ${st} und ${st+1} – nicht die Striche!`;
    if(s==='umschr'){
      if(t.type==='zsm') return `Ein Ganzes sind ${k}/${k}. Erweitere jeden Bruch so, dass unten ${k} steht. Passt ein Nenner nicht in ${k} (wie bei 10/5), kürze zuerst und erweitere dann.`;
      const m=t.t; return k%m.d===0?`Mit welcher Zahl musst du ${m.d} malnehmen, damit ${k} herauskommt? Nimm den Zähler mit derselben Zahl mal.${m.w?` Bei den Ganzen hilft: 1 Ganzes = ${k}/${k}.`:''}`:`${m.d} passt nicht in ${k}. Kürze ${m.n}/${m.d} zuerst so weit wie möglich. Dann erweitere auf ${k}.`;}
    if(s==='markier') return `Der Zähler (mit Nenner ${k}) sagt dir, wie viele Teile du ab 0 nach rechts zählen musst.${st?` Achtung: Der Strahl beginnt bei ${st}.`:''}${t.type==='zsm'?' Tippe zuerst die Zahl an, dann den Strich.':''}`;
    if(s==='ablesen') return st?`Der Strahl beginnt bei ${st}. Zähle die Teile von ${st} bis zum Pfeil und rechne sie zu ${st} dazu.`:`Zähle die Teile von 0 bis zum Pfeil. Der Nenner ist ${k}.`;
    if(s==='vereinf') return 'Kürze so weit wie möglich. Ist der Zähler größer als der Nenner, bündle zu Ganzen.';}
  if(t.type==='cmp'){ if(s==='gleichv') return `Suche einen gemeinsamen Nenner für ${t.a.d} und ${t.b.d} und erweitere beide Zahlen darauf.`;
    return 'Bei gleichen Nennern ist der Bruch mit dem größeren Zähler größer. Die Spitze von < und > zeigt immer zur kleineren Zahl.';}
  if(t.type==='ord'){ if(s==='gleichv') return `Suche einen Nenner, in den alle Nenner passen (${[...new Set(t.items.map(m=>m.d))].join(', ')}). Erweitere alle Zahlen darauf.`;
    return 'Vergleiche die Zähler der gleichnamigen Brüche. Tippe zuerst die kleinste Zahl an, dann die nächstgrößere.';}
  return '';
}
// ---------------------------------------------------------- Beispiel zum Abschreiben (Stufe 3: ganze Zahl minus gemischte Zahl)
function openExample(first){
  clearTimeout(S.advTimer);
  const ov=$('#ov'); ov.hidden=false;
  const row=(h,n)=>`<div class="ml-line">${h}${n?`<span class="note" style="font-family:var(--f-text);font-size:13px;color:var(--muted)">← ${pretty(n)}</span>`:''}</div>`;
  const M=L.M;
  ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="exh">
    <h2 id="exh">📒 ${first?'Neu auf Stufe 3: ':''}Ganze Zahl minus gemischte Zahl</h2>
    <p style="margin:0">Bei ${F(M(7,0,1))} − ${F(M(2,3,4))} hat die 7 keinen Bruchteil. Davon kann man ${F(M(0,3,4))} nicht abziehen. Darum <b>entbündelst</b> du zuerst ein Ganzes – in Viertel, weil die zweite Zahl Viertel hat.</p>
    <div class="exbox">
      ${row(`${F(M(7,0,1))}<span>−</span>${F(M(2,3,4))}`,'')}
      ${row(`<span>=</span>${F(M(6,4,4))}<span>−</span>${F(M(2,3,4))}`,'entbündeln: 7 = 6 + 4/4')}
      ${row(`<span>=</span>${F(M(4,1,4))}`,'rechnen: 6 − 2 = 4 und 4/4 − 3/4 = 1/4')}
    </div>
    <div class="ml-vis" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-hand);font-size:22px"><span>7 = 6 +</span>${barSVG(4,4,{w:200})}<span>= 6</span>${F(M(0,4,4))}</div>
    <div class="ml-expl"><b>So geht's:</b> 1 Ganzes abgeben (aus 7 wird 6) und als Bruch mit dem Nenner der zweiten Zahl dazuschreiben (1 = ${F(M(0,4,4))}). Dann wie immer: Ganze minus Ganze, Zähler minus Zähler, der Nenner bleibt. Am Ende kürzen, wenn es geht.</div>
    <p style="margin:12px 0 0;font-weight:600">✏️ Schreibe dieses Beispiel mit der Überschrift „Ganze Zahl minus gemischte Zahl“ in dein Heft ab.</p>
    <div class="ml-nav"><button class="btn primary" id="ex_ok">${first?'Ich habe es abgeschrieben ✓':'Schließen'}</button></div>
  </div>`;
  $('#ex_ok').focus();
}
function openSolution(){
  if(!S.task) return;
  if(!S.solved&&!S.usedHelp){S.usedHelp=true; if(!S.hadError) addErr();}
  ML={lines:solutionLines(S.task),i:0}; drawSolution();
}
function drawSolution(){
  const ov=$('#ov'); ov.hidden=false;
  const ln=ML.lines; const i=ML.i;
  ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="mlh">
    <h2 id="mlh">👀 Musterlösung</h2>
    <div class="ml-lines">${ln.slice(0,i+1).map((l,j)=>`<div class="ml-line ${j===i?'new':''}">${l.html}</div>`).join('')}</div>
    <div class="ml-expl" aria-live="polite">${pretty(ln[i].expl)}</div>
    ${ln[i].vis?`<div class="ml-vis">${ln[i].vis}</div>`:''}
    <div class="ml-nav"><span class="cnt">Schritt ${i+1} von ${ln.length}</span>
      <button class="btn" id="ml_prev" ${i===0?'disabled':''}>← Zurück</button>
      <button class="btn primary" id="ml_next" ${i===ln.length-1?'disabled':''}>Weiter →</button>
      <button class="btn" id="ml_close">Schließen</button></div>
    ${!S.solved?'<p class="foot" style="text-align:left">Die Aufgabe kommt danach in dein Fehler-Training – so übst du sie noch einmal selbst.</p>':''}
  </div>`;
  const nx=$('#ml_next'); (nx&&!nx.disabled?nx:$('#ml_close')).focus();
}
function closeOv(){ $('#ov').hidden=true; $('#ov').innerHTML=''; }

// ---------------------------------------------------------- Eigene Aufgabe
function openOwn(){
  const c=S.cat==='mix'?STATION.cats[0]:S.cat; const ov=$('#ov'); ov.hidden=false;
  let f='';
  if(c==='add'||c==='sub') f=`<div class="row2"><label>Erste Zahl<input id="o_a" placeholder="z. B. 4 3/8" autocomplete="off"></label>
     <label>Rechenzeichen<select id="o_op"><option value="+" ${c==='add'?'selected':''}>+</option><option value="-" ${c==='sub'?'selected':''}>−</option></select></label>
     <label>Zweite Zahl<input id="o_b" placeholder="z. B. 2 7/8" autocomplete="off"></label></div>`;
  if(c==='vg') f=`<label>Zahlen (mit ; trennen)<input id="o_list" placeholder="z. B. 3/4; 2/3; 5/6" autocomplete="off"></label><p class="foot" style="text-align:left;margin:0">Zwei Zahlen = Vergleichen, drei oder mehr = Ordnen.</p>`;
  if(c==='zs') f=`<div class="row2"><label>Zahl oder mehrere Zahlen<input id="o_t" placeholder="z. B. 1/12; 5/6; 1 1/3; 10/5" autocomplete="off"></label>
     <label>Strahl von<input id="o_s" value="0" inputmode="numeric"></label><label>bis<input id="o_e" value="2" inputmode="numeric"></label>
     <label>Teile pro Ganzes<input id="o_k" placeholder="z. B. 12" inputmode="numeric"></label></div>
     <label>Aufgabe (bei einer Zahl)<select id="o_m"><option value="mark">Zahl eintragen</option><option value="read">Zahl ablesen</option></select></label><p class="foot" style="text-align:left;margin:0">Mehrere Zahlen mit Semikolon trennen – dann trägst du alle auf einem Strahl ein, wie in der Klassenarbeit.</p>`;
  ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="owh"><h2 id="owh">✏️ Eigene Aufgabe</h2>
    <p style="margin:0;font-size:14.5px">Gib eine Aufgabe aus deinem Schulbuch ein. Schreibe gemischte Zahlen mit Leerzeichen: <b>2 3/4</b>.</p>
    <form id="ownf" class="form">${f}<div class="err" id="o_err" role="alert"></div>
    <div class="ml-nav"><button class="btn primary" type="submit">Los geht's</button><button class="btn" type="button" id="ml_close">Abbrechen</button></div></form></div>`;
  const first=ov.querySelector('input'); if(first) first.focus();
  $('#ownf').addEventListener('submit',ev=>{ev.preventDefault();
    const v=id=>($('#'+id)||{}).value;
    const r=L.customTask(c,{a:v('o_a'),b:v('o_b'),op:v('o_op'),list:v('o_list'),t:v('o_t'),start:v('o_s'),end:v('o_e'),k:v('o_k'),mode:v('o_m')});
    if(r.err){$('#o_err').textContent=r.err;return;}
    closeOv(); newTask(r.task);
  });
}

// ---------------------------------------------------------- Ereignisse
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button,[data-tick]'); if(!b) return;
  if(b.dataset.cat){S.cat=b.dataset.cat;save();newTask();scrollTab();return;}
  if(b.dataset.lv){if(S.cat==='err')return;S.levels[S.cat]=+b.dataset.lv;S.streak[S.cat]=0;save();newTask();return;}
  if(b.dataset.item!=null&&!S.solved){S.zsm.active=+b.dataset.item;S.fb=null;render();return;}
  if(b.dataset.tick!=null&&!S.solved&&S.task.type==='zsm'){const Z=S.zsm,tk=+b.dataset.tick,a=Z.active;
    if(Z.locked[a]) return;
    Z.ticks.forEach((x,i)=>{if(x===tk&&i!==a&&!Z.locked[i])Z.ticks[i]=null;});
    Z.ticks[a]=tk;
    const t=S.task,nx=t.items.findIndex((_,i)=>!Z.locked[i]&&Z.ticks[i]==null);
    if(nx>=0) Z.active=nx;
    S.fb=null;render();return;}
  if(b.dataset.tick!=null&&!S.solved){S.tick=+b.dataset.tick;S.fb=null;const t=S.task;$('#nl').innerHTML=nlSVG(t,{clickable:true,sel:S.tick,...(t.mode==='read'?{arrow:L.zsIndex(t)}:{})});$('#fb').innerHTML='';return;}
  if(b.dataset.sym){S.sym=b.dataset.sym;S.fb=null;document.querySelectorAll('[data-sym]').forEach(x=>{x.setAttribute('aria-pressed',String(x.dataset.sym===S.sym));x.classList.remove('bad');});$('#fb').innerHTML='';return;}
  if(b.dataset.card!=null&&!S.solved){const i=+b.dataset.card;const p=S.seq.indexOf(i);if(p>=0)S.seq.splice(p,1);else S.seq.push(i);S.fb=null;render();return;}
  switch(b.id){
    case 'b_check':check();break;
    case 'b_tip':S.tip=tipText();{const keep={};document.querySelectorAll('#sheet input.nb').forEach(el=>keep[el.id]=el.value);const fb=S.fb;S.fb=null;render();S.fb=fb;for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id];}}break;
    case 'b_sol':clearTimeout(S.advTimer);openSolution();break;
    case 'b_ex':openExample(false);break;
    case 'ex_ok':S.seen.subEx=true;save();closeOv();focusFirst();break;
    case 'b_hist':clearTimeout(S.advTimer);S.keep={};document.querySelectorAll('#sheet input.nb').forEach(el=>S.keep[el.id]=el.value);S.view=S.history.length-1;render();break;
    case 'h_prev':S.view=Math.max(0,S.view-1);render();break;
    case 'h_next':S.view=Math.min(S.history.length-1,S.view+1);render();break;
    case 'h_back':S.view=null;if(S.solved){newTask();}else{render();for(const id in S.keep){const el=document.getElementById(id);if(el)el.value=S.keep[id];}}break;
    case 'b_reset':{const he=S.hadError,uh=S.usedHelp,so=S.solved;resetTask();S.hadError=he||so;S.usedHelp=uh;S.solved=false;break;}
    case 'b_new':newTask();break;
    case 'b_own':openOwn();break;
    case 'b_clear':S.seq=[];S.fb=null;render();break;
    case 'ml_prev':ML.i=Math.max(0,ML.i-1);drawSolution();break;
    case 'ml_next':ML.i=Math.min(ML.lines.length-1,ML.i+1);drawSolution();break;
    case 'ml_close':closeOv();if(S.solved&&S.view==null)newTask();break;
    case 'theme':{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';break;}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#ov').hidden){if($('#ex_ok')){S.seen.subEx=true;save();}closeOv();if(S.solved&&S.view==null)newTask();return;}
  if(ev.key==='Enter'&&$('#ov').hidden&&ev.target.matches&&ev.target.matches('input.nb')){ev.preventDefault();check();}
});
document.addEventListener('input',ev=>{ if(ev.target.matches('input.nb')) ev.target.classList.remove('bad','ok'); });
$('#ov').addEventListener('click',ev=>{ if(ev.target.id==='ov'&&!$('#ex_ok')){ closeOv(); if(S.solved&&S.view==null)newTask(); } });

load(); newTask();
})();
</script>
