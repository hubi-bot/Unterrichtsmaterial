<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zitierheft – Richtig zitieren in der Facharbeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Patrick+Hand&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Aufmachung wie im Rechenheft: Heft mit Registerreitern, eine Heftseite, Blättern mit Zurück/Weiter. */
:root {
  --desk: #e9eef3; --paper: #f3f5f1; --sheet: #fdfcf7; --karo: #d6e1ee; --ink: #25303f; --muted: #5b6677; --line: #d5dde6; --grid: #e4ebf2;
  --accent: #1c3fa0; --accent-ink: #fff; --accent-soft: #e6eeff;
  --marker: #f2c230; --marker-ink: #1a1a1a; --marker-soft: #fdf4d3;
  --ok: #1d8248; --ok-soft: #e2f2e8; --bad: #cf2f2a; --bad-soft: #fbe8e5; --warn: #7a5300; --warn-soft: #fcf0d4;
  --quote: #fce9a6; --cite: #d9e6fa; --own: #ddf1e4; --dark: #1f2937; --dark-ink: #e7ebf3;
  --c1: #2f7fc4; --c2: #e0592a; --c3: #8352bf; --c4: #c2410c; --c5: #1d8248; --c6: #a8791a; --c7: #b4235a; --c8: #0f766e;
  --tab: var(--c1);
  --hand: "Patrick Hand", "Comic Sans MS", cursive;
  --f-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Lexend", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --desk: #121620; --paper: #232a3b; --sheet: #1c2232; --karo: #2b364f; --ink: #e7ebf3; --muted: #a4aec3; --line: #344058; --grid: #263047;
  --accent: #93b6ff; --accent-ink: #121620; --accent-soft: #26335a;
  --marker-soft: #2e2710; --ok: #55d492; --ok-soft: #133022; --bad: #ff6b64; --bad-soft: #3a1916; --warn: #f2c46b; --warn-soft: #30260e;
  --quote: #4a3d0e; --cite: #1e3354; --own: #173525; --dark: #0f1420;
  --c1: #5aa9ec; --c2: #ff7a4d; --c3: #ab85e8; --c4: #f08a4b; --c5: #55d492; --c6: #e0ae45; --c7: #f06292; --c8: #4fd1c5; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden], .hidden { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.55; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.25; text-wrap: balance; }
h3 { font-size: 1.05rem; } h4 { font-size: .98rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tab); outline-offset: 2px; }
main.book { max-width: 900px; margin: 0 auto; padding: 18px 14px 48px; }

/* Umschlag */
.cover { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.label { background: var(--sheet); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 18px 6px; transform: rotate(-1.2deg); box-shadow: 3px 3px 0 var(--ink); }
.label h1 { font-family: var(--hand); font-weight: 400; font-size: 44px; line-height: 1; color: var(--accent); }
.label p { font-size: 13px; color: var(--muted); }
.coverside { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stat { background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: 13px; border: 1px solid var(--karo); }
.stat b { font-weight: 700; }
.smallbtn { border: 2px solid var(--ink); background: var(--sheet); border-radius: 10px; padding: 5px 12px; font-size: 14px; font-weight: 500; box-shadow: 2px 2px 0 var(--ink); }
.smallbtn:active { transform: translate(2px, 2px); box-shadow: none; }

/* Registerreiter */
.tabs { display: flex; gap: 5px; margin: 22px 0 0 8px; position: relative; z-index: 1; overflow-x: auto; scrollbar-width: none; padding-top: 6px; }
.tabs::-webkit-scrollbar { display: none; }
.rtab { flex: none; border: none; border-radius: 12px 12px 0 0; padding: 8px 10px 10px; font-weight: 700; font-size: 13.5px; color: #fff; opacity: .6; transform: translateY(6px); transition: transform .15s, opacity .15s; white-space: nowrap; }
.rtab .n { font-family: var(--hand); font-size: 21px; line-height: 0; margin-right: 5px; vertical-align: -1px; }
.rtab .ck { margin-left: 4px; font-size: 12px; background: rgba(255,255,255,.3); border-radius: 99px; padding: 0 6px; }
.rtab[aria-selected="true"] { opacity: 1; transform: none; }
.rtab:hover { opacity: .9; }

/* Heftseite */
.sheet { position: relative; background: var(--sheet); border-radius: 4px 14px 14px 14px; border-top: 6px solid var(--tab); padding: 20px 18px 18px; box-shadow: 0 2px 0 var(--karo), 0 10px 30px rgba(20,30,50,.08);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; min-height: 520px; display: flex; flex-direction: column; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 44px; width: 2px; background: color-mix(in srgb, var(--bad) 40%, transparent); pointer-events: none; }
.inner { position: relative; padding-left: 40px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.chap { font-size: 12.5px; font-weight: 700; color: var(--tab); text-transform: uppercase; letter-spacing: .06em; background: var(--sheet); width: fit-content; padding: 0 6px; border-radius: 4px; }
.ptitle { font-family: var(--hand); font-weight: 400; font-size: 36px; line-height: 1.05; color: var(--ink); background: var(--sheet); width: fit-content; padding: 0 8px; border-radius: 6px; }
.pbody { display: grid; gap: 14px; align-content: start; }
.pbody > * { min-width: 0; }
.txt-block { background: var(--sheet); padding: 6px 10px; border-radius: 8px; max-width: 66ch; font-size: 1.04rem; }
.txt-block b { color: var(--ink); }
.say { font-size: 1.12rem; background: var(--sheet); padding: 6px 10px; border-radius: 8px; max-width: 62ch; }

/* Blätterleiste */
.pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 16px; }
.dots { display: flex; gap: 6px; align-items: center; margin: 0 auto; background: var(--sheet); padding: 4px 8px; border-radius: 99px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tab); background: var(--sheet); padding: 0; }
.dot.on { background: var(--tab); }
.dot.task::after { content: ""; }
.dot.solved { border-color: var(--ok); background: var(--ok-soft); }
.dot.solved.on { background: var(--ok); }
.pcount { font-size: 13px; color: var(--muted); background: var(--sheet); padding: 2px 8px; border-radius: 6px; }
.btn { font-weight: 500; border-radius: 10px; padding: 9px 16px; border: 2px solid var(--ink); background: var(--sheet); box-shadow: 2px 2px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.primary, .btn.main { background: var(--tab); border-color: var(--tab); color: #fff; font-weight: 700; box-shadow: 2px 2px 0 var(--ink); }
.btn.ghost { background: var(--sheet); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }

.hint-line { font-size: 13px; color: var(--muted); margin: 10px 0 0 4px; }
/* Karten */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; max-width: 80ch; }
.card h3 { font-size: 1.1rem; }
.card.info { border: 0; border-left: 5px solid var(--accent); background: var(--accent-soft); }
.card.rule { border: 2px solid var(--ink); }
.card.rule > h3::before { content: "Merke · "; color: var(--accent); }
.card.warncard { border: 0; border-left: 5px solid var(--marker); background: var(--marker-soft); }
.card.dark { background: var(--dark); color: var(--dark-ink); border-color: transparent; }
.card.dark a { color: #9CC3FF; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; max-width: 980px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; max-width: 980px; }
.grid2 .card, .grid3 .card { max-width: none; }
.list { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.small { font-size: .88rem; color: var(--muted); }
.tag { display: inline-block; font-family: var(--f-mono); font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.y { background: var(--marker); color: var(--marker-ink); }
.tag.g { background: var(--ok-soft); color: var(--ok); }
.tag.r { background: var(--bad-soft); color: var(--bad); }
.ex { background: var(--paper); border-radius: 10px; padding: 10px 14px; font-size: .98rem; }
.ex b.q { background: var(--quote); font-weight: 400; padding: 0 2px; border-radius: 3px; }
.ex b.c { background: var(--cite); font-weight: 700; padding: 0 3px; border-radius: 3px; white-space: nowrap; }
.ex b.o { background: var(--own); font-weight: 400; padding: 0 2px; border-radius: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .85rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.legend .lq::before { background: var(--quote); } .legend .lc::before { background: var(--cite); } .legend .lo::before { background: var(--own); } .legend .lm::before { background: var(--bad-soft); border: 1px dashed var(--bad); }
.mono { font-family: var(--f-mono); font-size: .9em; }
.pattern { font-family: var(--f-mono); font-size: .9rem; background: var(--paper); border-radius: 8px; padding: 10px 12px; line-height: 1.7; overflow-wrap: anywhere; }
.pattern i { font-style: italic; }
.pattern .pa { color: var(--accent); font-weight: 700; } .pattern .pb { color: var(--ok); font-weight: 700; } .pattern .pc { color: var(--warn); font-weight: 700; } .pattern .pd { color: var(--bad); font-weight: 700; }
.hang { padding-left: 2.2em; text-indent: -2.2em; }
.ex.hang, .lvout.hang { padding-left: calc(14px + 2.2em); }
.stack > * { min-width: 0; }
.card { align-content: start; }
.tag { justify-self: start; }
.casecard { align-content: start; min-width: 0; }

/* Zitier-Treppe */
.stairs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 10px; max-width: 820px; }
.stair { border-radius: 12px 12px 0 0; padding: 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); border: 1px solid var(--line); border-bottom: 0; background: var(--sheet); }
.stair:nth-child(1) { min-height: 140px; }
.stair:nth-child(2) { min-height: 200px; background: var(--accent-soft); }
.stair:nth-child(3) { min-height: 260px; background: var(--ok-soft); }
.stair h4 { font-size: 1.05rem; }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.stairs-base { height: 6px; background: var(--ink); border-radius: 3px; max-width: 820px; }

/* Klammer-Anatomie */
.anat { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2px; font-family: var(--f-mono); font-size: clamp(1.1rem, 3.2vw, 1.6rem); font-weight: 700; }
.anat > span { display: grid; justify-items: center; gap: 6px; }
.anat em { font-style: normal; padding: 4px 6px; border-radius: 6px; }
.anat small { font-family: var(--f-body); font-size: .8rem; font-weight: 700; color: var(--muted); text-align: center; max-width: 12ch; line-height: 1.2; }
.anat .a em { background: var(--accent-soft); color: var(--accent); }
.anat .b em { background: var(--ok-soft); color: var(--ok); }
.anat .c em { background: var(--warn-soft); color: var(--warn); }
.tablewrap { overflow-x: auto; max-width: 980px; }
.ct { border-collapse: collapse; width: 100%; font-size: .93rem; background: var(--sheet); border-radius: 10px; overflow: hidden; }
.ct th, .ct td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.ct th { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--paper); }
.ct td.mono { white-space: nowrap; }

/* A4-Seiten */
.a4row { display: flex; flex-wrap: wrap; gap: 20px; }
.a4 { width: 230px; aspect-ratio: 1 / 1.414; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.08); padding: 18px 16px; display: grid; align-content: start; gap: 9px; position: relative; }
.a4 .ln { height: 6px; border-radius: 3px; background: var(--line); }
.a4 .ln.s { width: 70%; }
.a4 .h { height: 9px; width: 55%; background: var(--ink); border-radius: 3px; margin-bottom: 4px; }
.a4 .ci { display: inline-block; width: 30px; height: 8px; border-radius: 3px; background: var(--accent); }
.a4 .lnc { display: flex; gap: 4px; align-items: center; } .a4 .lnc .ln { flex: 1; }
.a4 .ow .ln { background: var(--ok); opacity: .45; }
.a4-cap { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.stamp { position: absolute; right: 10px; bottom: 12px; transform: rotate(-12deg); font-family: var(--f-display); font-weight: 800; font-size: .9rem; border: 3px solid; border-radius: 6px; padding: 2px 8px; letter-spacing: .05em; }
.stamp.bad { color: var(--bad); } .stamp.good { color: var(--ok); }

/* Aufgaben */
.task { border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; max-width: 80ch; }
.task-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.task-h h3 { font-size: 1.08rem; }
.task-no { font-family: var(--f-mono); font-size: .75rem; font-weight: 700; color: var(--marker-ink); background: var(--marker); border-radius: 6px; padding: 1px 8px; }
.task.solved { border-color: var(--ok); }
.task.solved .task-no { background: var(--ok); color: #fff; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 5px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .why { display: block; font-size: .88rem; margin-top: 4px; color: var(--ink); }
.rows { display: grid; gap: 0; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 240px) 1.4em; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding: 9px 0; }
.srow:first-child { border-top: 0; }
.srow .why { grid-column: 1 / -1; font-size: .88rem; background: var(--paper); border-radius: 8px; padding: 6px 10px; }
select { font-size: .95rem; padding: 7px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; }
.mark { font-weight: 800; font-size: 1.15rem; }
.mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); }
.sentences { line-height: 2.1; }
.sent { border: 1.5px dashed var(--line); background: var(--paper); border-radius: 8px; padding: 3px 7px; cursor: pointer; margin-right: 4px; text-align: left; line-height: 1.5; }
.sent[aria-pressed="true"] { border-style: solid; border-color: var(--accent); background: var(--cite); }
.sent.right { border-color: var(--ok); border-style: solid; }
.sent.wrong { border-color: var(--bad); border-style: solid; background: var(--bad-soft); }
.sent sup { font-family: var(--f-mono); font-weight: 700; color: var(--accent); margin-right: 3px; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: r; }
.rank li { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; counter-increment: r; }
.rank li::before { content: counter(r); font-family: var(--f-mono); font-weight: 700; color: var(--accent); width: 1.2em; flex: none; }
.rank .rk-t { flex: 1; min-width: 0; font-size: .92rem; }
.rk-btn { display: flex; gap: 4px; flex: none; }
.mini { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; width: 38px; height: 34px; cursor: pointer; }
input.txt, textarea.txt { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); padding: 9px 11px; }
input.txt.mono { font-family: var(--f-mono); font-size: 1rem; }
textarea.txt { resize: vertical; min-height: 120px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field .hint { font-size: .8rem; color: var(--muted); }

.btn { font-weight: 700; border-radius: 10px; padding: 10px 18px; border: 1.5px solid transparent; cursor: pointer; background: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); background: var(--sheet); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.marker { background: var(--marker); color: var(--marker-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn:focus-visible, .nav-it:focus-visible, .mini:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .sent:focus-visible, .casecard:focus-visible, summary:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fb { border-radius: 10px; padding: 12px 16px; display: grid; gap: 6px; border: 1px solid; }
.fb.good { background: var(--ok-soft); border-color: var(--ok); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb.note { background: var(--warn-soft); border-color: transparent; }
.fb-h { font-family: var(--f-display); font-weight: 800; }
.done-banner { display: flex; gap: 14px; align-items: center; background: var(--ok-soft); border: 2px solid var(--ok); border-radius: 14px; padding: 14px 18px; max-width: 80ch; }
.done-banner .big { font-size: 2rem; }

/* Aufklappkarten */
details.fold { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; max-width: 80ch; }
details.fold > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none; display: flex; gap: 10px; align-items: center; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; margin-left: auto; font-family: var(--f-mono); color: var(--accent); font-size: 1.2rem; }
details.fold[open] > summary::after { content: "–"; }
details.fold > div { padding: 0 16px 14px; display: grid; gap: 8px; }
.err-no { font-family: var(--f-mono); font-size: .75rem; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 1px 7px; flex: none; }

/* Fallakten */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; max-width: 980px; }
.casecard { text-align: left; border: 2px solid var(--line); border-radius: 4px 14px 14px 14px; background: var(--sheet); padding: 0; cursor: pointer; display: grid; overflow: hidden; position: relative; }
.casecard:hover { border-color: var(--accent); }
.casecard.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.casecard .tab { background: #C9A86A; color: #2A1E08; font-family: var(--f-mono); font-size: .72rem; font-weight: 700; letter-spacing: .06em; padding: 6px 14px; text-transform: uppercase; }
.casecard .cbody { padding: 12px 14px 14px; display: grid; gap: 6px; }
.casecard .ch { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; line-height: 1.2; }
.casecard .meta { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.casecard .tx { font-size: .9rem; }
.casecard .cw { font-size: .78rem; color: var(--warn); }
.substeps { display: flex; flex-wrap: wrap; gap: 6px; }
.sp { border-radius: 99px; border: 1.5px solid var(--line); background: var(--sheet); font-size: .85rem; font-weight: 700; cursor: pointer; padding: 6px 14px; }
.sp.cur { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

}
function restoreInp(el) {

function normCite(s) {
  return s.trim().replace(/\s+/g, ' ').replace(/\s*-\s*|\s*—\s*|\s*–\s*/g, '–').replace(/ und /g, ' & ').replace(/S\.(\d)/g, 'S. $1').replace(/,(\S)/g, ', $1').replace(/\s+\)/g, ')').replace(/\(\s+/g, '(');
}

function checkTask(el, quiet) {
  const id = el.dataset.task, q = Q[id], fbx = $('.fbx', el);
  let ok = false, msg = '';
  if (q.type === 'mc') {
    const sel = $('input:checked', el);
    if (!sel) { fbx.innerHTML = '<div class="fb note">Wähle zuerst eine Antwort.</div>'; return; }
    const i = +sel.value; const o = q.opts[i];
    $$('.opt', el).forEach(l => { l.classList.remove('right', 'wrong'); $('.why', l).hidden = true; });
    const lab = $('.opt[data-i="' + i + '"]', el); lab.classList.add(o.ok ? 'right' : 'wrong'); const w = $('.why', lab); w.textContent = o.why; w.hidden = false;
    ok = o.ok; msg = ok ? 'Richtig!' : 'Noch nicht – lies die Begründung und versuche es noch einmal.';
  } else if (q.type === 'sort') {
    let right = 0, empty = 0;
    $$('.srow', el).forEach(r => {
      const it = q.items[+r.dataset.i], v = $('select', r).value, mk = $('.mark', r), w = $('.why', r);
      if (v === '') { empty++; mk.textContent = ''; mk.className = 'mark'; w.hidden = true; return; }
      const good = +v === it.a; if (good) right++;
      mk.textContent = good ? '✓' : '✗'; mk.className = 'mark ' + (good ? 'ok' : 'bad');
      w.hidden = good; w.textContent = good ? '' : 'Hinweis: ' + it.why;
    });
    ok = right === q.items.length; msg = ok ? 'Alles richtig eingeordnet!' : (empty ? 'Noch ' + empty + ' offen. ' : '') + right + ' von ' + q.items.length + ' richtig – schau dir die Hinweise an.';
  } else if (q.type === 'click') {
    let wrong = 0; const notes = [];
    $$('.sent', el).forEach(b => {
      const s = q.sents[+b.dataset.i], on = b.getAttribute('aria-pressed') === 'true';
      const good = on === s.need; b.classList.toggle('right', good); b.classList.toggle('wrong', !good);
      if (!good) { wrong++; notes.push('<b>Satz ' + (+b.dataset.i + 1) + ':</b> ' + s.why); }
    });
    const wl = $('.whylist', el); wl.innerHTML = notes.join('<br>'); wl.hidden = !notes.length;
    ok = !wrong; msg = ok ? 'Genau! Fremde Informationen werden belegt, eigene Gedanken nicht.' : wrong + ' Satz/Sätze noch falsch eingeschätzt.';
  } else if (q.type === 'order') {
    const seq = $$('li', el).map(li => +li.dataset.k);
    ok = seq.every((k, i) => k === i); msg = ok ? 'Richtig sortiert! ' + q.why : 'Noch nicht ganz. ' + q.why;
  } else if (q.type === 'build') {
    const v = normCite($('input', el).value);
    if (!v) { fbx.innerHTML = '<div class="fb note">Schreibe zuerst deinen Beleg.</div>'; return; }
    ok = q.accept.some(r => r.test(v));
    msg = ok ? 'Richtig: ' + esc(q.solution) : 'Noch nicht. Deine Eingabe: <span class="mono">' + esc(v) + '</span>' + buildHint(v) + '<br><button type="button" class="btn ghost small" data-sol style="margin-top:6px">Lösung zeigen</button>';
  }
  fbx.innerHTML = '<div class="fb ' + (ok ? 'good' : 'bad') + '"><span class="fb-h">' + (ok ? 'Gelöst' : 'Prüfe noch einmal') + '</span><span>' + msg + '</span></div>';
  const sb = $('[data-sol]', fbx); if (sb) sb.addEventListener('click', () => { sb.replaceWith(Object.assign(document.createElement('span'), { innerHTML: '<br>Lösung: <span class="mono">' + esc(q.solution) + '</span>' })); });
  if (ok && !S.solved[id]) { S.solved[id] = true; save(); el.classList.add('solved'); const no = $('.task-no', el); no.textContent += ' ✓'; afterSolve(); }
  if (quiet && ok) fbx.innerHTML = '<div class="fb good"><span class="fb-h">Gelöst ✓</span></div>';
}
function buildHint(v) {
  if (!/^\(.*\)$/.test(v)) return '<br>Der Beleg steht in runden Klammern.';
  if (/Seite|s\.\s?\d/.test(v)) return '<br>Seitenangabe so: „S. 12“.';
  if (/\b(Mara|Tim|Jana|Sabine)\b/.test(v)) return '<br>Nur Nachnamen verwenden.';
  if (/Mutter|Mittank/.test(v)) return '<br>Die Mutter hat den Artikel nicht geschrieben.';
  return '';
}

/* ===== Prüfung eigener Texte (Fallwerkstatt) ===== */
function parseCite(inner, ctx) {
  let x = inner.trim().replace(/\s+/g, ' ');
  const errs = [], warns = [];
  if (/^vgl\.?\s/i.test(x)) { errs.push('„vgl.“ wird bei APA nicht verwendet.'); x = x.replace(/^vgl\.?\s*/i, ''); }
  const zn = x.match(/^(.*?),?\s*zit(?:iert|\.)\s*n(?:ach|\.)\s*(.+)$/i); if (zn) x = zn[2];
  const m = x.match(/^(.+?),\s*(\d{4}[a-z]?|o\.\s?[JD]\.)\s*(?:,\s*(.+))?$/);
  if (!m) {
    if (/^S\.\s*\d/.test(x)) errs.push('Nachname und Jahr fehlen – nur die Seite reicht nicht.');
    else if (!/\d{4}|o\.\s?[JD]\./.test(x)) errs.push('Das Erscheinungsjahr fehlt (ohne Datum: o. D.).');
    else errs.push('Reihenfolge/Kommas prüfen: (Nachname, Jahr, S. x).');
    return { ok: false, errs, warns };
  }
  const author = m[1].trim(), year = m[2], rest = (m[3] || '').trim();
  let page = null;
  if (!rest) errs.push('Die Seitenzahl fehlt (Vorgabe: Nachname, Jahr, S. x).');
  else {
    const p = rest.match(/^S\.\s?(\d+)(?:\s*(ff?)\.|\s*[–-]\s*(\d+))?$/);
    if (p) page = [+p[1], p[2] === 'f' ? +p[1] + 1 : p[2] === 'ff' ? +p[1] + 2 : +(p[3] || p[1])];
    else errs.push('Seitenangabe so schreiben: „S. 12“, „S. 12 f.“ oder „S. 12 ff.“.');
  }
  if (ctx) {
    const meta = ctx.meta, cs = ctx.cs;
    const isPerson = cs.persons.some(p => new RegExp('\\b' + p + '\\b', 'i').test(author));
    const metaAuthor = meta.noAuthor ? null : (meta.autor || '').trim();
    const matchesMeta = metaAuthor && author.toLowerCase().includes(metaAuthor.toLowerCase());
    if (isPerson && !matchesMeta) errs.push('„' + author + '“ ist eine Person aus der Reportage. In die Klammer gehört die Verfasserin bzw. der Verfasser des Artikels.');
    else if (metaAuthor && !matchesMeta) warns.push('Name passt nicht zu deiner Quellenkarte („' + metaAuthor + '“).');
    if (/^[A-ZÄÖÜ][a-zäöüß]+ [A-ZÄÖÜ][a-zäöüß-]+$/.test(author) && !metaAuthor) warns.push('Nur den Nachnamen angeben, keinen Vornamen.');
    if (meta.jahr && year !== meta.jahr && !/^o/.test(year)) warns.push('Das Jahr weicht von deiner Quellenkarte ab (' + meta.jahr + ').');
    if (page && (page[0] < cs.pages[0] || page[1] > cs.pages[1])) errs.push('S. ' + page[0] + ' liegt nicht im Artikel (S. ' + cs.pages[0] + '–' + cs.pages[1] + ').');
  }
  return { ok: !errs.length, errs, warns, author, year, page };
}

function analyzeText(text, caseId) {
  const t = text.replace(/\r/g, '');
  const cs = CASES[caseId], meta = metaFor(caseId), ctx = { cs, meta };
  const total = countWords(t);
  const cites = []; let m;
  const reC = /\(([^()]{2,160})\)/g;
  while ((m = reC.exec(t))) {
    const inner = m[1];
    if (!/\d{4}|o\.\s?[JD]\.|S\.\s?\d|Seite\s?\d/i.test(inner)) continue;
    cites.push(Object.assign({ s: m.index, e: m.index + m[0].length, inner, direct: false }, parseCite(inner, ctx)));
  }
  const quotes = [];
  const reQ = /„([^“”"]{2,}?)[“”"]|»([^«]{2,}?)«|"([^"]{2,}?)"/g;
  while ((m = reQ.exec(t))) quotes.push({ s: m.index, e: m.index + m[0].length, w: countWords(m[1] || m[2] || m[3]) });
  // Zitate mit Belegen verbinden
  quotes.forEach(q => {
    const after = cites.find(c => c.s >= q.e);
    if (!after) return;
    const between = t.slice(q.e, after.s);
    if (/^\s*$/.test(between)) { q.cite = after; after.direct = true; return; }
    if (/^\s*[.!?]\s*$/.test(between)) { q.cite = after; after.direct = true; q.punct = true; return; }
    if (!/[.!?](\s|$)/.test(between) && between.length < 220) { q.cite = after; after.direct = true; q.late = true; }
  });
  quotes.forEach(q => { if (q.cite && t.slice(q.e - 2, q.e - 1) === '.') q.punct = true; });
  quotes.forEach(q => { if (!q.cite && t.slice(q.e - 2, q.e - 1) === '.' ) { const nx = cites.find(c => c.s >= q.e && c.s - q.e < 4); if (nx) { q.cite = nx; nx.direct = true; q.punct = true; } } });
  const realQuotes = quotes.filter(q => q.cite || q.w >= 4);
  const directOk = realQuotes.filter(q => q.cite && q.cite.ok && q.cite.page);
  const directNoCite = realQuotes.filter(q => !q.cite);
  const punctErr = realQuotes.filter(q => q.punct);
  const quoteWords = realQuotes.reduce((a, q) => a + q.w, 0);
  const indirect = cites.filter(c => !c.direct && c.ok);
  const badCites = cites.filter(c => !c.ok);
  const warnCites = cites.filter(c => c.ok && c.warns.length);
  // Absätze
  const paras = []; const reP = /[^\n]+/g;
  while ((m = reP.exec(t))) if (countWords(m[0]) > 0) paras.push({ s: m.index, e: m.index + m[0].length });
  let own = null;
  if (paras.length) {
    const last = paras[paras.length - 1];
    const lastCites = cites.filter(c => c.s >= last.s && c.e <= last.e);
    if (!lastCites.length && countWords(t.slice(last.s, last.e)) >= 18 && paras.length > 1) own = { s: last.s, e: last.e };
    else if (lastCites.length) {
      const tailStart = lastCites[lastCites.length - 1].e;
      const tail = t.slice(tailStart, last.e);
      if (countWords(tail) >= 18) own = { s: tailStart + (tail.length - tail.replace(/^[\s.!?]+/, '').length), e: last.e };
    }
  }
  // Belegdichte: lange Strecken ohne Klammer (ohne eigenen Schluss)
  const gaps = [];
  paras.forEach(p => {
    let pos = p.s;
    const inP = cites.filter(c => c.s >= p.s && c.e <= p.e);
    inP.forEach(c => { const w = countWords(t.slice(pos, c.s)); if (w > 70) gaps.push({ s: pos, e: c.s, w, hard: w > 90 }); pos = c.e; });
    const endS = own && own.s >= pos && own.s <= p.e ? own.s : p.e;
    const w = countWords(t.slice(pos, endS));
    if (w > 45 && !(own && pos >= own.s)) gaps.push({ s: pos, e: endS, w, hard: w > 90, trailing: true });
  });
  return { t, total, cites, quotes: realQuotes, directOk, directNoCite, punctErr, quoteWords, indirect, badCites, warnCites, paras, own, gaps };
}

/* =====================================================================

const T = id => '<div data-slot="' + id + '"></div>';
const P = html => '<p class="txt-block">' + html + '</p>';
const C = t => '<b class="c">' + t + '</b>';
const Ldir = '<span class="lbl l-dir">direktes Zitat</span>';

<script>
const MUSTER = 'Im März 2019 verschwand die 34-jährige Krankenpflegerin Anna K. nach einer Nachtschicht spurlos aus einer Kleinstadt in Niedersachsen (Lupe, 2022, S. 20). Ihr Auto wurde zwei Tage später auf einem Waldparkplatz entdeckt; Kampfspuren fanden die Ermittler nicht, wohl aber eine fremde Faser am Fahrersitz (Lupe, 2022, S. 21–22).\nErst drei Jahre später führte ein Abgleich dieser Faser mit einer neu angelegten Datenbank zu einem Kollegen der Vermissten, der daraufhin gestand (Lupe, 2022, S. 25). Die leitende Kommissarin beschreibt den Durchbruch rückblickend so: „Am Ende hat uns nicht ein Zeuge geholfen, sondern ein Faden, kaum länger als ein Fingernagel“ (Lupe, 2022, S. 26). Der Täter wurde wegen Totschlags verurteilt (Lupe, 2022, S. 27).\nDer Fall zeigt aus meiner Sicht, wie wichtig eine sorgfältige Spurensicherung auch dann ist, wenn zunächst nichts auf ein Verbrechen hindeutet. Ohne die gesicherte Faser wäre er vermutlich nie aufgeklärt worden. Für meine Facharbeit leite ich daraus die Frage ab, wie zuverlässig sich Textilfasern unter dem Schulmikroskop unterscheiden lassen.';

function renderWriter(box, id) {
  const c = CASES[id];
  const musterHL = highlight(analyzeMuster());
  box.innerHTML = '<div class="card info"><h3>Schreibauftrag: ' + c.title + '</h3><p>Gib den Fall in einem etwa <b>halbseitigen Text (ca. 200–300 Wörter)</b> wieder. Baue <b>mindestens ein direktes Zitat</b> und <b>mindestens zwei indirekte Zitate</b> ein. Belege regelmäßig. Schließe mit einem <b>eigenen Gedanken</b> ab: Was fällt dir auf, was folgt daraus, welche Frage wirft der Fall auf?</p></div>' +
    '<div class="grid2"><div class="card"><h3>Aufbau-Hilfe</h3><ol class="list"><li><b>Einstieg:</b> Wer? Was? Wann? Wo?</li><li><b>Hauptteil:</b> Ablauf, Ermittlungen, Ausgang – überwiegend indirekt zitiert</li><li><b>Ein direktes Zitat</b> an einer Stelle, an der der Wortlaut zählt (Expert:in, Gutachten, Betroffene)</li><li><b>Schluss:</b> eigener Gedanke ohne Klammer</li></ol></div>' +
    '<div class="card"><h3>Fundstellen in deiner Reportage</h3><ul class="list">' + c.spots.map(s => '<li><b>S. ' + s[0] + ':</b> ' + s[1] + '</li>').join('') + '</ul><p class="small">Dein Beleg: <span class="mono">' + esc(citeFor(id, 'x')) + '</span></p></div></div>' +
    '<details class="fold"><summary>📄 Mustertext ansehen (fiktiver Fall)</summary><div><div class="legend"><span class="lq">direktes Zitat</span><span class="lc">Beleg</span><span class="lo">eigener Gedanke</span></div><div class="hl">' + musterHL + '</div><p class="small">Quelle (erfunden): Lupe, M. (2022). Der Faden. <i>Beispielmagazin Crime</i>, (12), 20–27.</p></div></details>' +
    '<div class="card" style="max-width:none"><h3><label for="essay">Dein Text</label></h3><p class="small">Absätze mit Zeilenumbruch trennen. Anführungszeichen: „…“ (oder "…"). Dein Text wird nur auf diesem Gerät gespeichert.</p><textarea class="txt" id="essay" rows="14" spellcheck="true" placeholder="Im Jahr … ">' + esc(S.texts[id] || '') + '</textarea><div class="row"><div class="wordbar" style="flex:1;min-width:160px" aria-hidden="true"><b style="left:' + (200 / 3.6) + '%;width:' + (100 / 3.6) + '%"></b><i id="wbar"></i></div><span class="small mono" id="wcount"></span></div><div class="row"><button type="button" class="btn primary" id="runCheck">Text prüfen</button><button type="button" class="btn ghost small" id="copyEssay">Text + Literaturangabe kopieren</button></div></div>' +
    '<div id="reportBox" aria-live="polite"></div>';
  const ta = $('#essay', box);
  const wc = () => { const n = countWords(ta.value); $('#wcount').textContent = n + ' Wörter · Ziel 200–300'; $('#wbar').style.width = Math.min(100, n / 3.6) + '%'; };
  ta.addEventListener('input', () => { S.texts[id] = ta.value; save(); wc(); }); wc();
  $('#runCheck', box).addEventListener('click', () => runReport(id));
  $('#copyEssay', box).addEventListener('click', e => copyText(ta.value.trim() + '\n\nLiteraturverzeichnis\n' + lvFor(id, false), e.currentTarget));
  if (S.texts[id] && S.texts[id].trim()) runReport(id, true);
}
function analyzeMuster() {
  const keep = S.caseId; const fake = 'muster';
  CASES[fake] = { title: 'Der Faden', pages: [20, 27], persons: [] }; S.meta[fake] = { autor: 'Lupe', vor: 'M.', jahr: '2022', titel: 'Der Faden', heft: '12' };
  const r = analyzeText(MUSTER, fake); delete CASES[fake]; delete S.meta[fake]; S.caseId = keep; return r;
}

function highlight(r) {
  const t = r.t, cls = new Array(t.length).fill('');
  const paint = (s, e, k) => { for (let i = s; i < e; i++) cls[i] = k; };
  if (r.own) paint(r.own.s, r.own.e, 'o');
  r.gaps.filter(g => g.hard || g.trailing).forEach(g => { for (let i = g.s; i < g.e; i++) if (!cls[i]) cls[i] = 'gap'; });
  r.quotes.forEach(q => paint(q.s, q.e, 'q'));
  r.cites.forEach(c => paint(c.s, c.e, c.ok ? 'c' : 'c err'));
  let out = '', cur = null, buf = '';
  for (let i = 0; i <= t.length; i++) {
    const k = i < t.length ? cls[i] : '__end';
    if (k !== cur) { if (buf) out += cur ? '<span class="' + cur + '">' + esc(buf) + '</span>' : esc(buf); buf = ''; cur = k; }
    if (i < t.length) buf += t[i];
  }
  return out;
}

function runReport(id, silent) {
  const ta = $('#essay'); const txt = ta ? ta.value : (S.texts[id] || '');
  const box = $('#reportBox'); if (!box) return;
  if (!txt.trim()) { if (!silent) box.innerHTML = '<div class="fb note">Schreibe zuerst deinen Text.</div>'; return; }
  const r = analyzeText(txt, id);
  const items = [];
  const add = (state, title, detail, hard) => items.push({ state, title, detail, hard });
  // 1 Umfang
  add(r.total >= 180 && r.total <= 330 ? 'ok' : (r.total >= 150 && r.total <= 380 ? 'warn' : 'bad'), 'Umfang: ' + r.total + ' Wörter', 'Eine halbe DIN-A4-Seite sind etwa 200–300 Wörter.', !(r.total >= 150 && r.total <= 380));
  // 2 direkte Zitate
  const dq = r.directOk.length;
  add(dq >= 1 ? 'ok' : 'bad', 'Direkte Zitate mit vollständigem Beleg: ' + dq, dq >= 1 ? 'Gut – achte darauf, dass dein Zitat eine wichtige Aussage untermauert.' : 'Mindestens ein direktes Zitat in „…“ mit (Nachname, Jahr, S. x) direkt dahinter.', dq < 1);
  if (r.directNoCite.length) add('bad', r.directNoCite.length + ' Zitat(e) ohne Beleg', 'Hinter jedes direkte Zitat gehört sofort die Klammer.', true);
  if (r.punctErr.length) add('bad', 'Satzzeichen beim Zitat', 'Der Punkt gehört hinter die Klammer: „…“ (Nachname, Jahr, S. x).', true);
  // 3 indirekte
  const ind = r.indirect.length;
  add(ind >= 2 ? 'ok' : 'bad', 'Indirekte Zitate mit Beleg: ' + ind, ind >= 2 ? 'Gut – der Großteil deines Textes beruht auf eigenen Formulierungen.' : 'Mindestens zwei Stellen, die du in eigenen Worten wiedergibst und belegst.', ind < 2);
  // 4 Belegformat
  if (r.badCites.length) add('bad', r.badCites.length + ' Beleg(e) fehlerhaft', r.badCites.map(c => '<span class="mono">(' + esc(c.inner) + ')</span>: ' + c.errs.join(' ')).join('<br>'), true);
  else if (r.cites.length) add('ok', 'Alle ' + r.cites.length + ' Belege im Format (Nachname, Jahr, S. x)', '', false);
  if (r.warnCites.length) add('warn', 'Bitte prüfen', [...new Set(r.warnCites.flatMap(c => c.warns))].join(' '), false);
  // 5 Anteil direkt
  const share = r.total ? Math.round(r.quoteWords / r.total * 100) : 0;
  add(share <= 20 ? 'ok' : (share <= 30 ? 'warn' : 'bad'), 'Anteil wörtlicher Zitate: ' + share + ' %', share <= 20 ? 'Schön sparsam.' : 'Direkte Zitate zählen nicht als Eigenleistung – kürze oder paraphrasiere.', share > 30);
  // 6 Belegdichte
  const hardGaps = r.gaps.filter(g => g.hard), softGaps = r.gaps.filter(g => !g.hard);
  if (hardGaps.length) add('bad', 'Belege zu selten', 'Mindestens eine Passage mit über 90 Wörtern ohne Beleg (rot gestrichelt). Sind das wirklich alles eigene Gedanken? Sonst Belege ergänzen.', true);
  else if (softGaps.length) add('warn', 'Belegdichte prüfen', 'Rot gestrichelt: längere Passage ohne Beleg. Stammt die Information aus der Reportage, gehört eine Klammer dazu.', false);
  else add('ok', 'Regelmäßig belegt', 'Keine langen Passagen ohne Beleg.', false);
  // 7 Eigenleistung
  add(r.own ? 'ok' : 'bad', r.own ? 'Eigener Gedanke am Schluss erkannt' : 'Eigener Abschluss fehlt', r.own ? 'Grün markiert. Prüfe: Ist das wirklich eine Deutung, Einschätzung oder Frage – keine bloße Wiederholung?' : 'Schreibe am Ende einen eigenen Absatz (mind. 2 Sätze) ohne Klammer: deine Deutung, Einschätzung oder eine Frage, die der Fall aufwirft.', !r.own);
  if (r.paras.length < 2) add('warn', 'Nur ein Absatz', 'Gliedere deinen Text in Absätze (Zeilenumbruch), z. B. Fall – Ermittlungen – eigener Gedanke.', false);

  const passed = !items.some(i => i.hard);

      '<div class="report">' + fb.kriterien.map(k => '<div class="chk ' + RCLS(k.bewertung || '') + '"><span class="ic">' + ({ ok: '✓', warn: '!', bad: '✗' })[RCLS(k.bewertung || '')] + '</span><div><b>' + esc(k.name) + ' – ' + esc(k.bewertung) + '</b><span>' + esc(k.rueckmeldung) + '</span>' + (k.beispiele && k.beispiele.length ? '<ul class="small">' + k.beispiele.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' : '') + '</div></div>').join('') + '</div>' +

      (fb.naechste_schritte && fb.naechste_schritte.length ? '<h4>Deine nächsten Schritte</h4><ul class="list">' + fb.naechste_schritte.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') +
      (fb.fazit ? '<p class="txt-block"><b>Fazit:</b> ' + esc(fb.fazit) + '</p>' : '') +
      '<p class="small">Die Rückmeldung wurde von einer KI erstellt. Sie kann sich irren und ersetzt nicht die Bewertung durch deine Lehrkraft.</p></div>';
  }
  if (fallback || !fb) {
    const r = analyzeText(S.texts[id] || '', id);
    html += '<details class="fold"' + (fallback ? ' open' : '') + '><summary>Automatische Formalprüfung (ohne KI)</summary><div><div class="legend"><span class="lq">direktes Zitat</span><span class="lc">Beleg</span><span class="lo">eigener Gedanke</span><span class="lm">ohne Beleg / fehlerhaft</span></div><div class="hl">' + highlight(r) + '</div>' +

}

async function makePDF(id) {
  const msg = $('#pdfMsg');
  if (!window.jspdf) { msg.textContent = 'PDF-Werkzeug konnte nicht geladen werden.'; return; }
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 18, TW = W - 2 * M; let y = 20;
  const clean = s => String(s || '').replace(/[^\u0000-ÿ„“‚‘’–—…€•]/g, '');
  const line = (txt, size = 10.5, style = 'normal', gap = 1.6, color = [30, 40, 50]) => {
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
    doc.splitTextToSize(clean(txt), TW).forEach(l => { if (y > 280) { doc.addPage(); y = 20; } doc.text(l, M, y); y += size * 0.42 + gap * 0.5; });
    y += gap;
  };
  const head = t => { y += 2; if (y > 265) { doc.addPage(); y = 20; } doc.setDrawColor(180, 35, 90); doc.setLineWidth(0.6); doc.line(M, y - 4, M + 12, y - 4); line(t, 13, 'bold', 1.5); };
  const tp = S.topic[id] || {}, fb = S.fb[id];
  line('Zitierübung – Seminarfach Forensik', 17, 'bold', 2);
  line((S.name || 'Name: ______') + (S.kurs ? ' · ' + S.kurs : '') + ' · ' + new Date().toLocaleDateString('de-DE'), 10, 'normal', 2, [90, 100, 110]);
  line('Fall: ' + metaFor(id).titel + ' · Thema: ' + ((tp.t === 'Eigenes Thema' ? tp.own : tp.t) || '–'), 10.5, 'normal');
  if (tp.q) line('Leitfrage: ' + tp.q, 10.5, 'normal');
  head('Mein Text');
  (S.texts[id] || '').split(/\n+/).filter(p => p.trim()).forEach(p => line(p, 10.5, 'normal', 2.4));
  head('Literaturverzeichnis'); line(lvFor(id, false).replace(/<[^>]+>/g, ''), 10.5);
  if ((S.orig[id] || '').trim()) { head('Originalstellen (indirekt zitiert)'); line(S.orig[id], 9.5, 'normal', 1.6, [70, 80, 90]); }
  head('Rückmeldung der KI');
  if (fb && fb.kriterien) {
    if (fb.textSnapshot && fb.textSnapshot !== S.texts[id]) line('Hinweis: Der Text wurde nach dieser Rückmeldung noch verändert.', 9, 'italic', 1.5, [150, 90, 0]);
    fb.kriterien.forEach(k => { line(k.name + ': ' + k.bewertung, 10.5, 'bold', 0.6); line(k.rueckmeldung, 10, 'normal', 1); (k.beispiele || []).forEach(b => line('• ' + b, 9.5, 'normal', 0.6, [70, 80, 90])); y += 1.5; });
    if (fb.staerken && fb.staerken.length) { line('Das ist gelungen:', 10.5, 'bold', 0.6); fb.staerken.forEach(s => line('• ' + s, 10, 'normal', 0.6)); }
    if (fb.naechste_schritte && fb.naechste_schritte.length) { line('Nächste Schritte:', 10.5, 'bold', 0.6); fb.naechste_schritte.forEach(s => line('• ' + s, 10, 'normal', 0.6)); }
    if (fb.fazit) line('Fazit: ' + fb.fazit, 10, 'normal');
    line('Automatisch erstellt am ' + (fb.date || '') + '. Die KI-Rückmeldung ersetzt nicht die Bewertung durch die Lehrkraft.', 8.5, 'italic', 1, [110, 120, 130]);
  } else line('Noch keine KI-Rückmeldung eingeholt.', 10, 'italic');
  const blob = doc.output('blob');
  const fname = 'Zitieruebung_' + (S.name || 'Text').replace(/[^A-Za-zÄÖÜäöüß0-9]+/g, '_') + '.pdf';
  await saveFile(fname, blob, msg);
}

function renderLab() {

  const vals = (S.lab.v && S.lab.v[cur]) || [];

    '<div class="labtabs">' + LAB.map(x => '<button type="button" class="sp' + (x.k === cur ? ' cur' : '') + '" data-lab="' + x.k + '">' + x.t + '</button>').join('') + '</div>' +
    '<div class="card" style="max-width:none">' + L.f.map((f, i) => '<div class="field"><label for="lab' + i + '">' + f[0] + '</label>' + (L.area ? '<textarea class="txt" id="lab' + i + '" rows="5" placeholder="' + esc(f[1]) + '">' + esc(vals[i] || '') + '</textarea>' : '<input class="txt" id="lab' + i + '" placeholder="' + esc(f[1]) + '" value="' + esc(vals[i] || '') + '">') + '</div>').join('') +
    '<p class="small" style="margin-top:6px">Dein Prompt:</p><div class="prompt" id="labPrompt"></div>' +

    '<div class="labout" id="labOut" hidden></div></div>' +
    '<div class="card warncard"><p><b>Denk daran:</b> Gib keine Namen oder persönlichen Daten ein. Prüfe jede Antwort – vor allem Quellen. Nutzt du einen Inhalt aus der Antwort, musst du ihn nachweisen.</p></div>';
  const inputs = $$('#labBox .field .txt');
  const prompt = () => L.p(inputs.map(i => i.value.trim() || '[' + i.placeholder.replace(/^z\. B\. /, '') + ']'));
  const upd = () => { S.lab.v = S.lab.v || {}; S.lab.v[cur] = inputs.map(i => i.value); save(); $('#labPrompt').textContent = prompt(); };
  inputs.forEach(i => i.addEventListener('input', upd)); upd();
  $$('[data-lab]', box).forEach(b => b.addEventListener('click', () => { S.lab.k = b.dataset.lab; save(); renderLab(); }));
  $('#labCopy').addEventListener('click', e => copyText(prompt(), e.currentTarget));
  $('#labRun').addEventListener('click', async () => {
    if (inputs.some(i => !i.value.trim())) { $('#labMsg').textContent = 'Fülle zuerst das Feld aus.'; return; }

    const wrap = 'Du unterstützt eine Schülerin oder einen Schüler der Oberstufe bei der Facharbeit im Seminarfach Forensik. Regeln: Schreibe keine Textabschnitte, die direkt in die Facharbeit übernommen werden könnten. Erfinde keine Quellen, Zahlen oder Zitate. Antworte auf Deutsch, übersichtlich und knapp (höchstens 250 Wörter). Erinnere am Ende in einem Satz daran, die Antwort zu prüfen.\n\nAnfrage:\n' + prompt();
    try {
      await askClaude(wrap, { onText: ({ text }) => { out.innerHTML = mdLite(text); } }).then(t => { out.innerHTML = mdLite(t); });

  });
}

const slotsOf = pg => (pg.h.toString().match(/T\('([^']+)'\)/g) || []).map(s => s.slice(3, -2));
function pageSolved(pg) { if (pg.init === 'feedback') return !!(S.caseId && S.fb[S.caseId]); const s = slotsOf(pg); return s.length > 0 && s.every(id => S.solved[id]); }
function pageHasTask(pg) { return pg.init === 'feedback' || slotsOf(pg).length > 0; }

function go(ch, pg) {

}
function renderPage() {
  const ch = CH[S.ch], i = S.pg[S.ch] || 0, pg = ch.pages[i], n = ch.pages.length;

    '<div class="pager"><button type="button" class="btn" id="prevBtn"' + (i === 0 && S.ch === 0 ? ' disabled' : '') + '>◀ Zurück</button>' +
    '<div class="dots">' + ch.pages.map((p, k) => '<button type="button" class="dot' + (k === i ? ' on' : '') + (pageHasTask(p) && pageSolved(p) ? ' solved' : '') + '" data-pg="' + k + '" aria-label="Seite ' + (k + 1) + ': ' + esc(p.t) + '" title="' + esc(p.t) + '"></button>').join('') + '</div>' +
    '<span class="pcount">Seite ' + (i + 1) + ' von ' + n + '</span>' + next + '</div>';
  $$('[data-slot]').forEach(slot => { slot.outerHTML = renderTask(slot.dataset.slot); });
  $$('#page [data-task]').forEach(bindTask);
  if (pg.init && INIT[pg.init]) INIT[pg.init]();
  $('#prevBtn').addEventListener('click', () => { if (i > 0) go(S.ch, i - 1); else if (S.ch > 0) go(S.ch - 1, CH[S.ch - 1].pages.length - 1); });
  const nb = $('#nextBtn'); if (nb) nb.addEventListener('click', () => { if (i < n - 1) go(S.ch, i + 1); else go(S.ch + 1, 0); });

}
